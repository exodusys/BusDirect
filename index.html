<title>BusDirect</title>

<style>
/* ============================================================
   BusDirect 2 — styles
   ============================================================ */
:root{
  --bg:#f5f5f4;--card:#fff;--fg:#18181b;--mut:#71717a;--line:#e7e5e4;
  --acc:#18181b;--acc-fg:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
  --r:18px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html.dark{
  --bg:#0b0b0f;--card:#18181b;--fg:#fafafa;--mut:#a1a1aa;--line:#27272a;
  --acc:#fafafa;--acc-fg:#0b0b0f;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif}
body{padding:calc(var(--safe-t) + 64px) 14px calc(var(--safe-b) + 40px);max-width:640px;margin:0 auto}
body.modal-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hidden{display:none!important}
.mut{color:var(--mut)}
.sm{font-size:12px}.xs{font-size:11px}
.b{font-weight:700}.bb{font-weight:800}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* ---- barre du haut ---- */
.top{position:fixed;inset:0 0 auto;z-index:20;padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line)}
.top-in{max-width:612px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-size:18px}
.top h1{font-size:19px;margin:0;letter-spacing:-.02em;flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.icon-btn:active{background:var(--line)}

/* ---- cartes et sections ---- */
.sec{margin:18px 0 0}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.sec-h h2{font-size:18px;margin:0;letter-spacing:-.02em;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:16px;text-align:center;color:var(--mut);font-size:13px}

/* ---- champs ---- */
.field{position:relative}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 4px 2px}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 40px 0 14px;outline:none}
.inp:focus{border-color:var(--fg)}
.inp-x{position:absolute;right:6px;bottom:7px;width:32px;height:32px;border-radius:10px;color:var(--mut)}
select.inp{padding-right:14px}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:15;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;max-height:300px;overflow-y:auto}
.sugg button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:active{background:var(--line)}

/* ---- boutons ---- */
.btn{height:44px;padding:0 16px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.btn.sm{height:34px;padding:0 12px;font-size:12px;border-radius:11px}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;color:#fff;font-size:11px;font-weight:800;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:7px;font-size:11px;font-weight:700;background:var(--line);color:var(--mut)}
.tag.ok{background:rgba(22,163,74,.14);color:var(--ok)}
.tag.bad{background:rgba(220,38,38,.12);color:var(--bad)}
.tag.warn{background:rgba(217,119,6,.14);color:var(--warn)}

/* ---- trajets ---- */
.trip{cursor:pointer}
.trip-top{display:flex;align-items:baseline;gap:8px}
.trip-time{font-size:20px;font-weight:800;letter-spacing:-.02em}
.trip-cd{margin-left:auto;font-weight:800;font-size:13px}
.trip-cd.now{color:var(--bad)}
.trip-lines{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.trip-lines .walk{font-size:12px;color:var(--mut)}
.trip-meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--mut)}
.del{color:var(--bad);font-weight:800;font-size:12px}
.more{display:flex;gap:8px;justify-content:center;margin-top:10px}

/* ---- détail ---- */
.leg{position:relative;padding:0 0 0 22px;margin:0}
.leg:before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:3px;border-radius:3px;background:var(--lc,var(--line))}
.leg.walk:before{background:repeating-linear-gradient(var(--mut) 0 3px,transparent 3px 7px);width:2px;left:8px}
.stop{position:relative;padding:5px 0}
.stop:before{content:"";position:absolute;left:-19px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--lc,var(--mut))}
.stop.big{font-weight:800}
.stop.big:before{width:13px;height:13px;left:-21px;top:9px}
.stop.past{opacity:.45}
.stop.here:before{background:var(--lc,var(--fg));box-shadow:0 0 0 4px color-mix(in srgb,var(--lc,var(--fg)) 30%,transparent)}
.xfer{margin:6px 0 6px 22px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:12px}

/* ---- favoris ---- */
.fav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fav{min-height:56px;border-radius:14px;padding:10px 12px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--fc,#71717a);display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px}
.fav.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);border-left-color:var(--fc,#71717a)}
.fav .xs{font-weight:600;opacity:.7}

/* ---- arrêts proches ---- */
.near{display:flex;align-items:center;gap:10px}
.compass{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:14px;transition:transform .25s}
.board{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.board-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.board-row .t{width:46px;font-weight:800}

/* ---- suivi ---- */
.track{border:2px solid var(--fg)}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
.big-cd{font-size:25px;font-weight:900;letter-spacing:-.03em}

/* ---- feuilles (pages modales) ---- */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:16px 16px calc(var(--safe-b) + 24px);animation:up .2s ease-out}
.sheet-h{display:flex;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--bg);padding:6px 0 10px;z-index:2}
.sheet-h h2{margin:0;font-size:20px;flex:1;letter-spacing:-.02em}
.sheet h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:20px 2px 8px}
.set-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .grow .xs{margin-top:2px}
.set-row input[type=number]{width:86px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg);padding:0 10px;text-align:right}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex-shrink:0;transition:.2s;margin:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw:checked{background:var(--ok)}
.sw:checked:after{left:23px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700;text-align:left}
.menu-item span:first-child{width:26px;text-align:center;font-size:18px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:700;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 20px);transform:translateX(-50%);z-index:60;background:var(--acc);color:var(--acc-fg);
  padding:10px 16px;border-radius:14px;font-weight:700;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--fg);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
.err{color:var(--bad);font-size:13px;padding:8px 2px}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var esc = function (v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var norm = function (s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
};
/* « Lausanne » ≈ « Lausanne, gare » ≈ « Lausanne Gare » */
var sameName = function (a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return false;
  if (a === b) return true;
  var strip = function (x) { return x.replace(/\b(gare|bahnhof|stazione|station|centre|zentrum)\b/g, '').replace(/\s+/g, ' ').trim(); };
  return strip(a) === strip(b);
};
/* distance en mètres */
var dist = function (a, b) {
  var R = 6371000, r = Math.PI / 180;
  var dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  var h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
var bearing = function (a, b) {
  var r = Math.PI / 180, y = Math.sin((b.lon - a.lon) * r) * Math.cos(b.lat * r);
  var x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lon - a.lon) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
};
var TZ = 'Europe/Zurich';
var hhmm = function (ms) {
  return ms == null || isNaN(ms) ? '--:--' : new Date(ms).toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
};
var dayLabel = function (ms) {
  return new Date(ms).toLocaleDateString(lang(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: TZ });
};
var zurichParts = function (ms) {
  var s = new Date(ms).toLocaleString('sv-SE', { timeZone: TZ });
  return { date: s.slice(0, 10), time: s.slice(11, 16) };
};
/* « 2026-10-29 », « 21:40 » (heure de Zurich) → millisecondes */
var zurichToMs = function (d, tm) {
  var guess = Date.parse(d + 'T' + tm + ':00Z');
  var p = zurichParts(guess);
  var off = Date.parse(p.date + 'T' + p.time + ':00Z') - guess;
  return guess - off;
};
var fmtDur = function (min) {
  min = Math.max(0, Math.round(min));
  var h = Math.floor(min / 60);
  return h ? h + ' h ' + String(min % 60).padStart(2, '0') : min + ' min';
};
var fmtDist = function (m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km'; };
var debounce = function (fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; };
var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

function migrate() {
  if (store.get('migrated')) return;
  /* favoris de l'ancienne version */
  try {
    var old = JSON.parse(oldGet('bd-tiles-v2') || '[]');
    if (Array.isArray(old) && old.length && !store.get('favs')) {
      store.set('favs', old.filter(function (t) { return t && (t.favoriteStop || t.to || t.from); }).map(function (t) {
        return { id: t.id || uid(), name: t.favoriteStop || t.to || t.from, color: t.color || '#57534e' };
      }));
    }
  } catch (e) {}
  /* réglages repris */
  var s = Object.assign({}, DEFAULT_SETTINGS);
  var th = oldGet('bd-theme'); if (th === 'dark' || th === 'light') s.theme = th;
  var lg = oldGet('bd_lang'); if (lg) s.lang = lg;
  var nr = parseInt(oldGet('bd_settings_tiles_distance'), 10); if (nr > 0) s.nearRadius = nr;
  var gi = parseInt(oldGet('bd_settings_geo_interval'), 10); if (gi > 0) s.geoInterval = gi;
  var lc = parseInt(oldGet('bd_list_count'), 10); if (lc > 0) s.listCount = lc;
  if (oldGet('bd_list_mode') === 'count') s.listMode = 'count';
  var km = parseInt(oldGet('bd_track_keep_min'), 10); if (km > 0) s.trackKeepMin = km;
  if (!store.get('settings')) store.set('settings', s);
  store.set('migrated', true);
}

  var start = atMs() - 60000;
  var L = list.filter(function (c) { return (c.boardMs || c.depMs) + (c.boardDelay || 0) * 60000 >= start; });
  if (S.listMode === 'count') return L.slice(0, w.count);
  var end = atMs() + w.minutes * 60000;
  var W = L.filter(function (c) { return c.depMs <= end; });
  return W.length ? W : L.slice(0, 3);
}
function moreButtons(w, key) {
  if (S.listMode === 'count') return '<div class="more"><button class="btn sm" data-more="' + key + '">' + t('moreN', { n: S.listCount }) + '</button></div>';
  return '<div class="more"><button class="btn sm" data-more="' + key + '">' + t('more', { n: S.listIncrement }) + '</button></div>';
}
function newWindow() { return { minutes: S.listMinutes, count: S.listCount }; }
function growWindow(w) { if (S.listMode === 'count') w.count += S.listCount; else w.minutes += S.listIncrement; }

var search = {
  from: store.get('from', null), to: store.get('to', null), via: null,
  list: null, busy: false, err: null, win: newWindow(),
  run: function () {
    var self = this;
    if (!this.to) { this.err = t('to') + ' ?'; render(); return; }
    var fromP = this.from && this.from.kind === 'me' ? null : this.from;
    if (!fromP && !geo.pos) { this.err = t('noGeo'); render(); return; }
    this.busy = true; this.err = null; this.list = null; this.win = newWindow(); render();
    var getFrom = fromP ? resolvePlace(fromP) : stopsNear(geo.pos, 3000).then(function (L) {
      if (!L.length) throw new Error('aucun arrêt');
      return { q: L[0].id, walkM: L[0].d, viaStop: L[0] };
    });
    Promise.all([getFrom, resolvePlace(this.to), this.via ? resolvePlace(this.via) : Promise.resolve(null)]).then(function (r) {
      return connections(r[0].q, r[1].q, { atMs: atMs(), windowMin: 180, minCount: 12, via: r[2] ? [r[2].q] : null });
    }).then(function (L) { self.list = L; }).catch(function (e) { self.err = /HTTP|fetch|abort|Failed/i.test(String(e)) ? t('offline') : String(e.message || e); })
      .then(function () { self.busy = false; render(); });

};

var join = {
  target: store.get('joinTarget', null), list: null, busy: false, err: null, win: newWindow(), stamp: 0, key: '',
  reload: function () { this.stamp = 0; if (this.target) this.load(); },
  load: function () {
    var self = this, fav = favs.find(function (f) { return f.id === self.target; });
    if (!fav || !geo.pos) { render(); return; }
    var key = fav.id + '|' + geo.pos.lat.toFixed(3) + ',' + geo.pos.lon.toFixed(3) + '|' + (when.ms || 'now');
    if (this.busy || (this.key === key && Date.now() - this.stamp < 30000)) return;
    this.busy = true; this.err = null; this.key = key;
    if (this.list && this.list._key !== fav.id) this.list = null;
    render();
    var here = false;
    resolvePlace(fav.place || { name: fav.name }).then(function (dest) {
      var dXY = dest.place && dest.place.lat != null ? dest.place : (dest.viaStop || null);
      if (dXY && dist(geo.pos, dXY) < 150) { here = true; return []; }
      /* Départ depuis les arrêts proches (tous modes), sans limite de marche ensuite */
      return stopsNear(geo.pos, S.joinRadius).then(function (starts) {
        if (!starts.length) return stopsNear(geo.pos).then(function (L) { return L.slice(0, 1); });
        return starts.slice(0, 6);
      }).then(function (starts) {
        return Promise.all(starts.map(function (st) {
          return connections(st.id, dest.q, { atMs: atMs(), windowMin: 120, minCount: 6, pages: 2, extra: { _origin: st.name, _originD: st.d } }).catch(function () { return []; });
        }));
      }).then(function (sets) {
        var seen = {}, out = [];
        [].concat.apply([], sets).forEach(function (c) {
          var k = c.boardStop + '|' + c.boardMs + '|' + c.secs.filter(function (s) { return s.kind === 'ride'; }).map(function (s) { return s.line; }).join(',');
          if (seen[k]) return; seen[k] = 1;
          /* temps total réel depuis ma position : marche jusqu'à l'arrêt de départ comprise */
          c._arrivalScore = c.arrMs + (c.arrDelay || 0) * 60000;
          out.push(c);
        });
        /* pour un même départ, on écarte les variantes qui arrivent plus tard avec plus de changements */
        out.sort(function (a, b) { return (a.boardMs - b.boardMs) || (a._arrivalScore - b._arrivalScore); });
        return out;
      });
    }).then(function (L) {
      self.here = here; self.list = L; self.list._key = fav.id; self.stamp = Date.now();
    }).catch(function (e) { self.err = /HTTP|fetch|abort|Failed/i.test(String(e)) ? t('offline') : String(e.message || e); })
      .then(function () { self.busy = false; render(); });
  }
};

function legHtml(c, liveIdx) {
  var h = '', rides = 0;
  c.secs.forEach(function (s, si) {
    if (s.kind === 'walk') {
      h += '<div class="leg walk"><div class="stop mut sm">🚶 ' + s.min + ' min ' + t('walk') + (s.to ? ' → ' + esc(s.to) : '') + '</div></div>';
      return;
    }
    if (rides++) {
      var prev = c.secs.slice(0, si).reverse().find(function (x) { return x.kind === 'ride'; });
      if (prev) {
        var waitMin = Math.round(((s.depMs + (s.depDelay || 0) * 60000) - (prev.arrMs + (prev.arrDelay || 0) * 60000)) / 60000);
        h += '<div class="xfer">🔁 ' + t('transfer') + ' · ' + esc(s.from) + ' · ' + t('wait') + ' ' + Math.max(0, waitMin) + ' min' +
          (s.depPlatform ? ' · ' + t('platform') + ' ' + esc(s.depPlatform) : '') + '</div>';
      }
    }
    h += '<div class="leg" style="--lc:' + s.color + '"><div class="row" style="margin:2px 0 4px">' + chip(s.line, s.color, s.mode) +
      '<span class="mut sm ell">→ ' + esc(s.dest) + '</span></div>';
    s.stops.forEach(function (p, pi) {
      var big = pi === 0 || pi === s.stops.length - 1;
      var tm = pi === 0 ? p.depMs : (p.arrMs || p.depMs);
      var state = liveIdx ? liveIdx(si, pi) : '';
      h += '<div class="stop' + (big ? ' big' : '') + (state ? ' ' + state : '') + '"><div class="row"><span class="tnum" style="width:44px">' + hhmm(tm) + '</span>' +
        '<span class="grow ell">' + esc(p.name) + '</span>' + (p.delay ? '<span class="del">+' + p.delay + '</span>' : '') +
        (big && p.platform ? '<span class="tag">' + t('platform') + ' ' + esc(p.platform) + '</span>' : '') + '</div></div>';
    });
    h += '</div>';
  });
  return h;
}

/* ------------------------------------------------------------
   14. Suivi en direct et alertes d'approche
   ------------------------------------------------------------ */
var tracker = {
  c: store.get('track', null), alerted: false, timer: null,
  start: function (c) { this.c = c; this.alerted = false; store.set('track', c); this.refresh(); render(); },
  stop: function () { this.c = null; store.set('track', null); render(); },
  /* toutes les arrêts du trajet dans l'ordre, avec leur heure réelle */
  points: function () {
    var P = [];
    (this.c.secs || []).forEach(function (s, si) {
      if (s.kind !== 'ride') return;
      s.stops.forEach(function (p, pi) {
        var tm = (pi === 0 ? p.depMs : (p.arrMs || p.depMs));
        if (tm != null) P.push({ si: si, pi: pi, name: p.name, ms: tm + (p.delay || 0) * 60000, lat: p.lat, lon: p.lon, color: s.color, line: s.line, mode: s.mode });
      });
    });
    return P;
  },
  state: function () {
    var c = this.c, now = Date.now(), P = this.points();
    if (!P.length) return null;
    var endMs = c.arrMs + (c.arrDelay || 0) * 60000;
    var idx = -1; P.forEach(function (p, i) { if (p.ms <= now) idx = i; });
    /* la position GPS corrige l'estimation horaire quand on est près d'un arrêt */
    if (geo.pos) {
      var best = null; P.forEach(function (p, i) { if (p.lat == null) return; var d = dist(geo.pos, p); if (d < 120 && (!best || d < best.d)) best = { i: i, d: d }; });
      if (best && Math.abs(best.i - idx) <= 2) idx = best.i;
    }
    var next = P[idx + 1] || null, last = P[P.length - 1];
    var start = P[0].ms, prog = Math.min(1, Math.max(0, (now - start) / Math.max(1, endMs - start)));
    return { P: P, idx: idx, next: next, last: last, endMs: endMs, prog: prog, before: now < start, done: now > endMs };
  },
  onPos: function () { if (this.c) this.check(); },
  check: function () {
    var st = this.c && this.state(); if (!st || !S.alertOn || this.alerted || st.done || st.before) return;
    var leftS = (st.endMs - Date.now()) / 1000;
    var near = geo.pos && st.last.lat != null ? dist(geo.pos, st.last) : Infinity;
    if (leftS <= S.alertSec || near <= S.alertDist) {
      this.alerted = true;
      var msg = t('approaching') + ' · ' + st.last.name;
      toast('🔔 ' + msg);
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
      try { if ('Notification' in window && Notification.permission === 'granted') new Notification('BusDirect', { body: msg }); } catch (e) {}
    }
  },
  /* met à jour retards et voies du trajet suivi */
  refresh: function () {
    var self = this, c = this.c; if (!c) return;
    var first = c.secs.find(function (s) { return s.kind === 'ride'; }), lastR = c.secs.slice().reverse().find(function (s) { return s.kind === 'ride'; });
    if (!first || !lastR || !first.stops[0] || !lastR.stops.length) return;
    var from = first.stops[0].id || first.from, to = lastR.stops[lastR.stops.length - 1].id || lastR.to;
    connections(from, to, { atMs: c.depMs - 60000, windowMin: 5, pages: 1 }).then(function (L) {
      var lines = c.secs.filter(function (s) { return s.kind === 'ride'; }).map(function (s) { return s.line; }).join(',');
      var m = L.find(function (x) { return Math.abs(x.depMs - (first.depMs)) < 90000 && x.secs.filter(function (s) { return s.kind === 'ride'; }).map(function (s) { return s.line; }).join(',') === lines; });
      if (m && self.c === c) {
        var walkLead = c.secs[0].kind === 'walk' ? [c.secs[0]] : [];
        var walkTail = c.secs[c.secs.length - 1].kind === 'walk' ? [c.secs[c.secs.length - 1]] : [];
        self.c = Object.assign({}, c, { secs: walkLead.concat(m.secs.filter(function (s, i, a) { return !(s.kind === 'walk' && (i === 0 || i === a.length - 1)); })).concat(walkTail), arrDelay: m.arrDelay, boardDelay: m.boardDelay });
        store.set('track', self.c); render();
      }
    }).catch(function () {});
  }
};
function renderTrack() {
  var c = tracker.c; if (!c) return '';
  var st = tracker.state(); if (!st) return '';
  if (Date.now() > st.endMs + S.trackKeepMin * 60000) { tracker.c = null; store.set('track', null); return ''; }
  var head;
  if (st.done) head = '<div class="big-cd">✅ ' + t('done') + '</div>';
  else if (st.before) head = '<div class="mut sm">' + esc(st.P[0].name) + '</div><div class="big-cd tnum" data-cdbig="' + st.P[0].ms + '">' + cdText(st.P[0].ms, 'departIn') + '</div>';
  else head = '<div class="mut sm">' + t('nextStop') + ' : <b>' + esc(st.next ? st.next.name : st.last.name) + '</b>' + (st.next ? ' · ' + hhmm(st.next.ms) : '') + '</div>' +
    '<div class="big-cd tnum" data-cdbig="' + st.endMs + '">' + cdText(st.endMs, 'arrivalIn') + '</div><div class="mut sm">' + esc(st.last.name) + ' · ' + hhmm(st.endMs) + '</div>';
  var stateOf = function (si, pi) {
    var k = st.P.findIndex(function (p) { return p.si === si && p.pi === pi; });
    if (k < 0) return ''; if (k === st.idx) return 'here'; return k < st.idx ? 'past' : '';
  };
  return '<section class="sec"><div class="sec-h"><h2>📡 ' + t('live') + '</h2><button class="btn sm" id="track-stop" type="button">' + t('stopFollow') + '</button></div>' +
    '<div class="card track">' + head + '<div class="prog"><i style="width:' + Math.round(st.prog * 100) + '%"></i></div>' +
    '<details style="margin-top:8px"><summary class="sm b" style="cursor:pointer">' + esc(c.from || '') + ' → ' + esc(c.to || '') + '</summary><div style="margin-top:8px">' + legHtml(c, stateOf) + '</div></details></div></section>';
}
function cdText(ms, key) {
  var s = Math.max(0, Math.round((ms - Date.now()) / 1000));
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return t(key) + ' ' + (h ? h + ' h ' : '') + (h || m ? m + ' min ' : '') + String(sec).padStart(2, '0') + ' s';
}

/* ------------------------------------------------------------
   15. Feuilles modales : menu, paramètres, sources, SMS, info
   ------------------------------------------------------------ */
var sheetEl = null;
function sheet(title, html) {
  closeSheet();
  var bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h2>' + title + '</h2><button class="icon-btn" data-close type="button" aria-label="' + t('close') + '">✕</button></div>' + html + '</div>';
  bg.addEventListener('click', function (e) { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(bg); document.body.classList.add('modal-open');
  sheetEl = bg; return bg;
}
function closeSheet() { if (sheetEl) sheetEl.remove(); sheetEl = null; document.body.classList.remove('modal-open'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

function openMenu() {
  var items = [['⚙️', t('settings'), openSettings], ['🎫', t('sms'), openSms], ['🗂️', t('sources'), openSources], ['🌐', t('language'), openLang], ['ℹ️', t('info'), openInfo]];
  var sh = sheet('BusDirect', items.map(function (it, i) { return '<button class="menu-item" data-mi="' + i + '" type="button"><span>' + it[0] + '</span><span>' + it[1] + '</span></button>'; }).join(''));
  sh.addEventListener('click', function (e) { var b = e.target.closest('[data-mi]'); if (b) items[+b.dataset.mi][2](); });
}
function openLang() {
  var sh = sheet('🌐 ' + t('language'), Object.keys(LANGS).map(function (k) {
    return '<button class="menu-item" data-lang="' + k + '" type="button"><span>' + (k === lang() ? '✓' : '') + '</span><span>' + LANGS[k] + '</span></button>';
  }).join(''));
  sh.addEventListener('click', function (e) { var b = e.target.closest('[data-lang]'); if (b) { S.lang = b.dataset.lang; saveSettings(); document.documentElement.lang = S.lang; closeSheet(); render(); } });
}
function setRow(label, hint, control) {
  return '<div class="set-row"><div class="grow"><div class="b">' + label + '</div>' + (hint ? '<div class="mut xs">' + hint + '</div>' : '') + '</div>' + control + '</div>';
}
var sw = function (key) { return '<input type="checkbox" class="sw" data-set="' + key + '"' + (S[key] ? ' checked' : '') + '>'; };
var num = function (key, min) { return '<input type="number" inputmode="numeric" data-set="' + key + '" min="' + (min || 1) + '" value="' + S[key] + '">'; };
function openSettings() {
  var seg = function (key, opts) {
    return '<div class="seg" data-seg="' + key + '">' + opts.map(function (o) { return '<button type="button" data-v="' + o[0] + '" class="' + (S[key] === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>';
  };
  var body =
    '<h3>Page principale</h3><div class="card">' +
      setRow('« ' + t('whereTo') + ' »', 'Désactivé : la recherche est masquée ; « Rejoindre mon parcours » et les arrêts proches restent affichés.', sw('showSearch')) +
      '<div class="set-row"><div class="grow b">' + t('theme') + '</div></div>' + seg('theme', [['auto', t('auto')], ['light', t('light')], ['dark', t('dark')]]) +
    '</div>' +
    '<h3>Localisation (GPS)</h3><div class="card">' +
      setRow('Localisation', 'Distances, arrêts proches, « Rejoindre », alertes.', sw('geo')) +
      setRow('Suivi en continu', 'Désactivé : position relevée à intervalle régulier.', sw('geoContinuous')) +
      setRow('Intervalle de rafraîchissement (s)', 'Utilisé si le suivi continu est désactivé. Minimum 1. Défaut 10.', num('geoInterval', 1)) +
    '</div>' +
    '<h3>Proximité</h3><div class="card">' +
      setRow('Arrêts à proximité (m)', 'Rayon de recherche autour de toi. Défaut 500.', num('nearRadius', 50)) +
      setRow('Arrêts de départ pour « Rejoindre » (m)', 'Arrêts d’où partent les trajets vers tes favoris. La marche ensuite n’est pas limitée. Défaut 1000.', num('joinRadius', 100)) +
    '</div>' +
    '<h3>Affichage des listes</h3><div class="card">' +
      '<div class="set-row"><div class="grow"><div class="b">Mode</div><div class="mut xs">Durée en minutes, ou nombre minimum de prochains trajets.</div></div></div>' + seg('listMode', [['minutes', 'Minutes'], ['count', 'Nombre']]) +
      setRow('Affichage des listes (minutes)', 'Défaut 60.', num('listMinutes', 5)) +
      setRow('Incrément de durée (minutes)', 'Bouton « + min ». Défaut 30.', num('listIncrement', 5)) +
      setRow('Nombre minimum de prochains trajets', 'Défaut 5.', num('listCount', 1)) +
    '</div>' +
    '<h3>Alertes d’approche</h3><div class="card">' +
      setRow('Alertes', 'Vibration + notification avant ton arrêt d’arrivée pendant un suivi.', sw('alertOn')) +
      setRow('Prévenir avant l’arrivée (secondes)', 'Défaut 120. Minimum 10.', num('alertSec', 10)) +
      setRow('Ou à cette distance de l’arrêt (m)', 'Selon ta position GPS. Défaut 400.', num('alertDist', 50)) +
      setRow('Suivi gardé après l’arrivée (minutes)', 'Défaut 30.', num('trackKeepMin', 1)) +
    '</div>' +
    '<h3>Tickets SMS</h3><div class="card">' + setRow('Service selon la ville détectée', 'Choisit le service SMS d’après ta position.', sw('smsAuto')) + '</div>' +
    '<h3>Données</h3><div class="card"><button class="btn full" id="set-reset" type="button">Réinitialiser les paramètres</button></div>';
  var sh = sheet('⚙️ ' + t('settings'), body);
  sh.addEventListener('change', function (e) {
    var k = e.target.dataset.set; if (!k) return;
    if (e.target.type === 'checkbox') S[k] = e.target.checked;
    else { var v = parseInt(e.target.value, 10), min = parseInt(e.target.min, 10) || 1; if (!(v >= min)) { v = DEFAULT_SETTINGS[k]; e.target.value = v; } S[k] = v; }
    saveSettings(); afterSettings(k);
  });
  sh.addEventListener('click', function (e) {
    var b = e.target.closest('[data-seg] button');
    if (b) { var k = b.parentNode.dataset.seg; S[k] = b.dataset.v; saveSettings(); b.parentNode.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); afterSettings(k); }
    if (e.target.id === 'set-reset') { S = Object.assign({}, DEFAULT_SETTINGS, { lang: S.lang }); saveSettings(); closeSheet(); afterSettings('all'); openSettings(); }
  });
}
function afterSettings(k) {
  if (k === 'theme' || k === 'all') applyTheme();
  if (/^geo/.test(k) || k === 'all') geoStart();
  if (k === 'nearRadius' || k === 'all') { near.stamp = 0; near.load(); }
  if (k === 'joinRadius' || k === 'all') join.reload();
  if (/^list/.test(k) || k === 'all') { search.win = newWindow(); join.win = newWindow(); }
  render();
}
function openSources() {
  var draw = function () {
    return '<p class="mut sm">Les horaires viennent de transport.opendata.ch (tout le réseau suisse). Les autres sources servent à trouver des adresses.</p><div class="list">' +
      sources.map(function (s, i) {
        return '<div class="card"><div class="row"><div class="grow"><div class="b">' + esc(s.name) + '</div><div class="mut xs">' + esc(s.type || '') + '</div><div class="mut xs ell">' + esc(s.url || '') + '</div></div>' +
          (s.locked ? '<span class="tag ok">Requise</span>' : '<input type="checkbox" class="sw" data-src="' + i + '"' + (s.active ? ' checked' : '') + '>') + '</div>' +
          (s.custom ? '<button class="btn sm" data-srcdel="' + i + '" style="margin-top:8px" type="button">' + t('del') + '</button>' : '') + '</div>';
      }).join('') + '</div>' +
      '<h3>Ajouter une source</h3><div class="card col"><input class="inp" id="src-name" placeholder="' + t('name') + '"><input class="inp" id="src-url" placeholder="https://…" inputmode="url">' +
      '<button class="btn pri" id="src-add" type="button">Ajouter ou mettre à jour</button></div>';
  };
  var sh = sheet('🗂️ ' + t('sources'), '<div id="src-body">' + draw() + '</div>');
  var redraw = function () { store.set('sources', sources); $('#src-body', sh).innerHTML = draw(); };
  sh.addEventListener('change', function (e) { if (e.target.dataset.src != null) { sources[+e.target.dataset.src].active = e.target.checked; redraw(); } });
  sh.addEventListener('click', function (e) {
    if (e.target.dataset.srcdel != null) { sources.splice(+e.target.dataset.srcdel, 1); redraw(); }
    if (e.target.id === 'src-add') {
      var n = $('#src-name', sh).value.trim(), u = $('#src-url', sh).value.trim();
      if (!/^https?:\/\//i.test(u)) { toast('URL invalide'); return; }
      var ex = sources.find(function (s) { return s.url === u; });
      if (ex) ex.name = n || ex.name; else sources.push({ id: 'c-' + uid(), name: n || u, type: 'Source personnalisée', url: u, active: true, custom: true });
      redraw();
    }
  });
}
/* Ville la plus proche → service SMS */
function nearestCity() {
  if (!geo.pos) return null;
  var best = null; CITIES.forEach(function (c) { var d = dist(geo.pos, c); if (!best || d < best.d) best = { c: c, d: d }; });
  return best && best.d < 40000 ? best.c : null;
}
function smsFor(city) {
  if (!city) return null;
  var k = norm(city.n), id = city.id;
  return SMS_CATALOG.find(function (s) { return (s.cities || []).some(function (x) { return norm(x) === k || x === id; }); }) ||
    (city.sms && city.sms.number ? { name: city.net + ' ' + city.n, number: city.sms.number, tickets: (city.sms.keywords || []).map(function (k) { return { code: k, label: k }; }), info: city.sms.info } : null);
}
function openSms() {
  var city = S.smsAuto ? nearestCity() : null;
  var svc = smsFor(city);
  var ticketBtns = function (s) {
    if (!s.number || /^app$/i.test(s.number)) return '<div class="mut sm">Application dédiée (pas de numéro SMS).</div>';
    return '<div class="list" style="margin-top:8px">' + (s.tickets || []).map(function (tk) {
      return '<a class="btn" style="justify-content:space-between;text-decoration:none" href="sms:' + esc(s.number) + '&body=' + encodeURIComponent(tk.code) + '"><span class="ell">' + esc(tk.label || tk.code) + '</span><span class="tag">' + esc(tk.code) + ' → ' + esc(s.number) + '</span></a>';
    }).join('') + '</div>';
  };
  var h = '<p class="mut sm">Le bouton ouvre l’app Messages avec le code prêt à envoyer. Vérifie toujours les consignes officielles du réseau : numéros, codes et tarifs peuvent changer.</p>';
  if (svc) h += '<h3>📍 ' + esc(city.n) + '</h3><div class="card"><div class="b">' + esc(svc.name) + '</div><div class="mut xs">' + esc(svc.info || '') + '</div>' + ticketBtns(svc) + '</div>';
  else h += '<div class="card empty">' + (S.smsAuto ? (geo.pos ? 'Aucun service SMS connu pour ta position.' : t('noGeo')) : 'Détection par ville désactivée.') + '</div>';
  h += '<h3>Tous les services SMS répertoriés</h3><div class="list">' + SMS_CATALOG.map(function (s) {
    return '<details class="card"><summary class="b" style="cursor:pointer">' + esc(s.name) + ' <span class="tag">' + esc(s.cc || '') + '</span> <span class="mut xs">' + esc(s.number || '') + '</span></summary>' +
      '<div class="mut xs" style="margin-top:6px">' + esc(s.info || '') + '</div>' + ticketBtns(s) + '</details>';
  }).join('') + '</div>';
  sheet('🎫 ' + t('sms'), h);
}
function openInfo() {
  sheet('ℹ️ Info — BusDirect',
    '<div class="card col sm">' +
    '<div><b>Où aller ?</b><br>Choisis un départ (ou ta position) et une destination : arrêt, adresse ou lieu. Tous les transports publics sont pris en compte : bus, tram, train, métro, bateau, funiculaire.</div>' +
    '<div><b>Rejoindre mon parcours</b><br>Tes arrêts et lieux favoris. Touche un favori : les prochains trajets s’affichent depuis les arrêts proches de toi, changements compris (bus ↔ tram ↔ train), sans limite de marche.</div>' +
    '<div><b>Arrêts à proximité</b><br>Les arrêts autour de toi, avec la direction (boussole) et le tableau des départs.</div>' +
    '<div><b>Suivi en direct</b><br>Touche un trajet puis « ' + t('follow') + ' » : compte à rebours, prochain arrêt, retards, et alerte avant ton arrêt d’arrivée.</div>' +
    '<div><b>Données</b><br>Horaires et temps réel : transport.opendata.ch. Les retards dépendent de ce que chaque réseau publie. Adresses : OpenStreetMap (Photon, Nominatim).</div>' +
    '<div><b>Tickets SMS</b><br>Catalogue indicatif ; BusDirect ne garantit ni les numéros ni les tarifs.</div>' +
    '</div><p class="mut xs" style="text-align:center;margin-top:14px">BusDirect 2.0</p>');
}
var toastT;
function toast(msg) {
  var el = $('.toast'); if (el) el.remove();
  el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(function () { el.remove(); }, 4000);
}

/* ------------------------------------------------------------
   16. Autocomplétion des lieux
   ------------------------------------------------------------ */
function placeAutocomplete(root, key, onPick) {
  var input = root.querySelector('[data-place="' + key + '"]'); if (!input) return;
  var box = null, seq = 0;
  var close = function () { if (box) box.remove(); box = null; };
  var show = function (items) {
    close(); if (!items.length) return;
    box = document.createElement('div'); box.className = 'sugg';
    box.innerHTML = items.map(function (p, i) {
      var ic = p.kind === 'me' ? '📍' : p.kind === 'stop' ? '🚏' : p.kind === 'poi' ? '📌' : '🏠';
      return '<button type="button" data-i="' + i + '"><span>' + ic + '</span><span class="grow ell">' + esc(p.kind === 'me' ? t('myPos') : p.name) + '</span></button>';
    }).join('');
    box.addEventListener('mousedown', function (e) { e.preventDefault(); });
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-i]'); if (!b) return;
      var p = items[+b.dataset.i]; input.value = p.kind === 'me' ? t('myPos') : p.name; close(); input.blur(); onPick(p);
    });
    input.parentNode.appendChild(box);
  };
  var meItem = key === 'from' ? [{ kind: 'me', name: t('myPos') }] : [];
  var run = debounce(function () {
    var q = input.value.trim(), my = ++seq;
    if (q.length < 2) { show(meItem); return; }
    searchPlaces(q).then(function (L) { if (my === seq && document.activeElement === input) show(meItem.concat(L)); });
  }, 220);
  input.addEventListener('input', run);
  input.addEventListener('focus', function () { if (!input.value) show(meItem); else run(); });
  input.addEventListener('blur', function () { setTimeout(close, 150); });
}

/* ------------------------------------------------------------
   17. Rendu principal et événements
   ------------------------------------------------------------ */
var app = $('#app');
function render() {
  /* ne pas casser une saisie en cours */
  var ae = document.activeElement;
  if (ae && app.contains(ae) && ae.matches('input[data-place]')) { pendingRender = true; return; }
  pendingRender = false;
  document.documentElement.lang = lang();
  $('#btn-menu').setAttribute('aria-label', 'Menu');
  app.innerHTML = renderTrack() + renderSearch() + renderFavs() + renderNear();
  ['from', 'to', 'via'].forEach(function (k) {
    placeAutocomplete(app, k, function (p) {
      search[k] = p; if (k !== 'via') store.set(k, p); render();
    });
  });
  updateCompasses();
}
var pendingRender = false;
document.addEventListener('focusout', function () { setTimeout(function () { if (pendingRender && !(document.activeElement && document.activeElement.matches && document.activeElement.matches('input[data-place]'))) render(); }, 200); });

app.addEventListener('click', function (e) {
  var el;
  if ((el = e.target.closest('[data-favedit]'))) { e.stopPropagation(); openFavEditor(el.dataset.favedit); return; }
  if ((el = e.target.closest('[data-fav]'))) {
    join.target = el.dataset.fav; store.set('joinTarget', join.target); join.list = null; join.win = newWindow(); join.reload(); render(); return;
  }
  if ((el = e.target.closest('.trip'))) {
    var src = el.dataset.list === 'search' ? search.shown : join.shown;
    var c = src && src[+el.dataset.i]; if (c) openTrip(c); return;
  }
  if ((el = e.target.closest('[data-near]'))) { enableCompass(); near.toggle(el.dataset.near); return; }
  if ((el = e.target.closest('[data-more]'))) { growWindow(el.dataset.more === 'search' ? search.win : join.win); render(); return; }
  if ((el = e.target.closest('[data-clear]'))) { var k = el.dataset.clear; search[k] = null; if (k !== 'via') store.set(k, null); render(); return; }
  switch (e.target.id) {
    case 's-go':
      /* texte tapé sans choisir de suggestion : utilisé tel quel */
      ['from', 'to', 'via'].forEach(function (k) {
        var v = (app.querySelector('[data-place="' + k + '"]') || {}).value; v = v && v.trim();
        if (!v) { search[k] = k === 'from' ? { kind: 'me', name: t('myPos') } : null; return; }
        if (v === t('myPos')) { search[k] = { kind: 'me', name: v }; return; }
        if (!search[k] || norm(search[k].name) !== norm(v)) search[k] = { name: v };
      });
      search.run(); break;
    case 's-swap': var a = search.from; search.from = search.to; search.to = a && a.kind === 'me' ? null : a; store.set('from', search.from); store.set('to', search.to); render(); break;
    case 's-now': when.ms = null; render(); join.reload(); break;
    case 'fav-add': openFavEditor(null); break;
    case 'geo-on': S.geo = true; saveSettings(); enableCompass(); geoStart(); break;
    case 'track-stop': tracker.stop(); break;
  }
});
app.addEventListener('change', function (e) {
  if (e.target.id === 's-date' || e.target.id === 's-time') {
    var d = $('#s-date').value, tm = $('#s-time').value;
    if (d && tm) {
      when.ms = zurichToMs(d, tm);
      if (Math.abs(when.ms - Date.now()) < 60000) when.ms = null;
      render(); join.reload();
    }
  }
});
$('#btn-menu').onclick = openMenu;
$('#btn-theme').onclick = function () {
  var dark = document.documentElement.classList.contains('dark');
  S.theme = dark ? 'light' : 'dark'; saveSettings(); applyTheme();
};

/* comptes à rebours : mise à jour chaque seconde sans tout redessiner */
setInterval(function () {
  document.querySelectorAll('[data-cd]').forEach(function (el) { el.outerHTML = countdown(+el.dataset.cd); });
  var big = document.querySelectorAll('[data-cdbig]');
  if (big.length && tracker.c) {
    var st = tracker.state();
    if (st) big.forEach(function (el) { el.textContent = cdText(+el.dataset.cdbig, st.before ? 'departIn' : 'arrivalIn'); });
    var bar = $('.prog i'); if (bar && st) bar.style.width = Math.round(st.prog * 100) + '%';
  }
  tracker.check();
}, 1000);
/* rafraîchissement des données : listes toutes les 30 s, suivi toutes les 30 s */
setInterval(function () {
  if (document.hidden) return;
  join.reload();
  if (tracker.c) tracker.refresh();
  render();
}, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) { join.reload(); near.stamp = 0; near.load(); render(); } });

/* ------------------------------------------------------------
   18. Démarrage
   ------------------------------------------------------------ */
applyTheme();
render();
geoStart();
if (geo.pos) { near.load(); join.load(); }
})();
</script>
