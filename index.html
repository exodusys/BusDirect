<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
  main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:48px;}
  h1{font-size:13px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.4;text-align:center;margin-bottom:8px;}
  .section{border:1px solid #1e1e1e;border-radius:20px;padding:28px;background:#0a0a0a;position:relative;overflow:hidden;}
  .section::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#2a2a2a,transparent);}
  .label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#666;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .label i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}
  .label.ios{color:#0a84ff} .label.android{color:#3ddc84}
  input{width:100%;background:#141414;border:1px solid #222;border-radius:12px;padding:14px 16px;color:#fff;font-size:14px;outline:none;transition:0.2s;}
  input:focus{border-color:#333;background:#171717;}
  .inputs{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
  .field{display:flex;flex-direction:column;gap:8px;}
