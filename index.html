<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BusDirect</title>
<style>
:root{
  --accent:#e30613; --bg:#eef2f7; --text:#0d1424; --muted:#5b6578;
  --glass-rgb:255,255,255; --glass-a:.55; --blur:22px; --radius:22px;
  --border:rgba(255,255,255,.6); --shadow:0 8px 30px rgba(15,23,42,.12);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#070b14; --text:#eef2ff; --muted:#93a0b8;
  --glass-rgb:22,28,44; --glass-a:.5; --border:rgba(255,255,255,.12);
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
main{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--safe-t) + 82px) 14px calc(var(--safe-b) + 100px);max-width:720px;margin:0 auto}
.glass{background:rgba(var(--glass-rgb),var(--glass-a));backdrop-filter:blur(var(--blur));border:1px solid var(--border);box-shadow:var(--shadow)}
header{position:fixed;top:calc(var(--safe-t) + 10px);left:14px;right:14px;z-index:20;padding:8px 14px;max-width:692px;margin:0 auto;display:flex;align-items:center;gap:10px;border-radius:28px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--accent);font-size:20px}
.appname{font-weight:800;font-size:20px}.appname span{color:var(--accent)}
.loc{font-size:10.5px;color:var(--muted);margin-left:auto;text-align:right}
section.view{display:none}section.view.active{display:block}
h2{font-size:28px;font-weight:800;margin:6px 4px 14px}
h3{font-size:13px;text-transform:uppercase;color:var(--muted);margin:18px 6px 8px}
.card{border-radius:var(--radius);padding:14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border-radius:20px;padding:14px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile.sel{outline:2.5px solid var(--accent)}
.tile .ico{font-size:22px}.tile .nm{font-weight:700;font-size:15px}.tile .sub{font-size:11px;color:var(--muted)}
.jr{border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.jr-top{display:flex;align-items:center;gap:12px}
.dep{font-size:26px;font-weight:800;text-align:right;line-height:1}
.lb{display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;white-space:nowrap}
.lb.main{min-width:46px;height:40px;font-size:19px;border-radius:10px}
.badge{font-weight:800;font-size:13px;padding:3px 8px;border-radius:7px;color:#fff;background:var(--accent)}
nav{position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 30px);z-index:30;border-radius:28px;display:flex;justify-content:space-around;padding:6px;max-width:692px;margin:0 auto}
nav button{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:600;padding:7px 2px;border-radius:20px;cursor:pointer}
nav button.active{color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;border-radius:16px;padding:4px 6px 4px 14px}
.search input{flex:1;border:none;background:transparent;font-size:16px;color:var(--text);padding:10px 0;outline:none}
.results{margin-top:8px;border-radius:18px;overflow:hidden}
.res{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.btn{border:none;border-radius:14px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:rgba(127,127,127,.18);color:var(--text)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:rgba(127,127,127,.35);border-radius:30px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:#34c759}
.switch input:checked+span::after{transform:translateX(20px)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--border)}
.seg{display:flex;background:rgba(127,127,127,.18);border-radius:11px;padding:3px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:9px;font-weight:600;color:var(--text);cursor:pointer;font-size:13px}
.seg button.on{background:rgba(var(--glass-rgb),1)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.muted{color:var(--muted)}
.info-view{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:14px}
.info-view.open{display:flex}
.info-sheet{width:100%;max-width:640px;height:100%;border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
.info-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:20px}
.info-body{flex:1;overflow-y:auto;padding:0 18px 24px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 128px);transform:translateX(-50%);opacity:0;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;z-index:40;transition:.25s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
#mapView{position:fixed;inset:0;z-index:30;display:none;background:var(--bg)}
#mapView.open{display:block}
#map{position:absolute;inset:0}
.map-bar{position:absolute;left:12px;right:12px;top:calc(var(--safe-t) + 10px);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.map-btn{width:38px;height:38px;border-radius:12px;border:none;background:rgba(127,127,127,.2);color:var(--text);font-size:17px;cursor:pointer}
</style>
</head>
<body>
<div id="appWallpaper"></div>

<header class="glass">
  <div class="logo" id="logo">🚌</div>
  <div class="appname">Bus<span>Direct</span></div>
  <div class="loc" id="locLabel">Localisation…</div>
</header>

<main>
  <section class="view active" id="v-horaires">
    <div class="row between"><h2>Horaires</h2><button class="btn ghost sm" onclick="locateMyTrip()">📍</button></div>
    <div class="tiles" id="tiles"></div>
    <div id="tilesEmpty" class="card glass empty" style="display:none"><b>🧭</b>Aucune destination.<br><button class="btn" onclick="goAddFirst()">＋ Ajouter</button></div>
  </section>
  <section class="view" id="v-list">
    <div class="list-top glass" id="listTop">
      <button class="btn ghost sm" onclick="closeList()">‹</button>
      <h2 id="jrTitle" class="list-title">Prochains départs</h2>
      <button class="btn ghost sm" onclick="goHome()">🏠</button>
    </div>
    <div id="journeys"></div>
  </section>
  <section class="view" id="v-suivis"><h2>Suivis</h2><div id="tracked"></div></section>
  <section class="view" id="v-parcours">
    <h2>Parcours</h2>
    <div class="search glass"><span>🔎</span><input id="q" placeholder="Arrêt, adresse ou lieu…"></div>
    <div class="results glass" id="results" style="display:none"></div>
    <h3>Mes destinations</h3><div class="card glass" id="destList"></div>
  </section>
  <section class="view" id="v-tickets"><h2>Tickets</h2><div class="card glass" id="smsList"></div></section>
  <section class="view" id="v-parametres">
    <div class="row between"><h2>Paramètres</h2><button class="info-btn" onclick="toggleInfo(true)">i</button></div>
    <h3>Apparence</h3>
    <div class="card glass">
      <div class="set"><span>Thème</span><div class="seg" id="themeSeg"><button data-v="light">Clair</button><button data-v="dark">Sombre</button><button data-v="auto">Auto</button></div></div>
    </div>
    <h3>Capteurs</h3>
    <div class="card glass">
      <div class="set"><div><b>📍 Localisation</b></div><label class="switch"><input type="checkbox" id="geoOn" onchange="setGeo(this.checked)"><span></span></label></div>
      <div class="set"><div><b>🧭 Mouvement</b></div><label class="switch"><input type="checkbox" id="motOn" onchange="setMotion(this.checked)"><span></span></label></div>
    </div>
  </section>
</main>

<nav class="glass" id="tabs">
  <button data-v="horaires" class="active">Horaires</button>
  <button data-v="suivis">Suivis</button>
  <button data-v="parcours">Parcours</button>
  <button data-v="tickets">Tickets</button>
  <button data-v="parametres">Paramètres</button>
</nav>

<div id="mapView">
  <div id="map"></div>
  <div class="map-bar glass"><button class="map-btn" onclick="closeMap()">✕</button><div class="t" id="mapTitle"></div></div>
</div>
<div class="toast glass" id="toast"></div>

<script>
const API='https://api.transitous.org/api';
const store={get(k,d){try{const v=localStorage.getItem('bd_'+k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem('bd_'+k,JSON.stringify(v))}catch{}}};
let S={dests:store.get('dests',[]),tracked:store.get('tracked',[]),settings:Object.assign({theme:'dark',accent:'#e30613',glass:true,nearestOnly:true,smsOn:false},store.get('settings',{}))};
const save=()=>{store.set('dests',S.dests);store.set('tracked',S.tracked);store.set('settings',S.settings)};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=d=>new Date(d).toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
const mins=s=>Math.round(s/60);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
const MODE_ICON={BUS:'🚌',TRAM:'🚋',SUBWAY:'🚇',RAIL:'🚆',COACH:'🚍',FERRY:'⛴️',WALK:'🚶'};
const TYPE_ICON={STOP:'🚏',ADDRESS:'🏠',PLACE:'📍'};

let pos=null,selDest=null,lastJourneys=[];

/* Navigation */
function setListTitle(){const el=$('#jrTitle');if(!el||!selDest)return;el.innerHTML=`<span>Vers - ${esc(selDest.name)}</span>`}
function listOpen(){return $('#v-list').classList.contains('active')}
function openList(){clickShieldUntil=Date.now()+500;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-list'));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.v==='horaires'));document.querySelector('main')?.scrollTo({top:0})}
function goHome(){document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id==='v-horaires'));document.querySelectorAll('#tabs button').forEach(el=>el.classList.toggle('active',el.dataset.v==='horaires'));document.querySelector('main')?.scrollTo({top:0})}
function closeList(){deselectTile();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-horaires'));document.querySelector('main')?.scrollTo({top:0})}
let clickShieldUntil=0;
['click','focusin','mousedown'].forEach(ev=>document.addEventListener(ev,e=>{if(Date.now()<clickShieldUntil){e.preventDefault();e.stopPropagation()}},true));

$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  if(listOpen())deselectTile();
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='suivis')renderTracked();
  document.querySelector('main')?.scrollTo({top:0});
});

/* Géolocalisation simplifiée */
const SENS={geo:{state:'—',acc:null,t:0,err:null},mot:{heading:null,t:0,perm:null}};
const GEO={
  get on(){return S.settings.geoOn!==false&&!!navigator.geolocation},
  getCurrentPosition(ok,ko,o){if(!this.on){ko&&ko({code:0});return}navigator.geolocation.getCurrentPosition(p=>{SENS.geo.acc=Math.round(p.coords.accuracy);SENS.geo.t=Date.now();SENS.geo.err=null;ok(p)},e=>{SENS.geo.err=e&&e.code===1?'refusée':'indisponible';ko&&ko(e)},o)},
  watchPosition(ok,ko,o){return navigator.geolocation.watchPosition(ok,ko,o)},
  clearWatch(id){navigator.geolocation.clearWatch(id)}
};
function setGeo(on){S.settings.geoOn=on;save();if(on){GEO.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};updateAddr();renderSMS();if(selDest)loadJourneys();toast('Localisation activée')},()=>toast('Localisation refusée'))}else{pos=null;$('#locLabel').textContent='Désactivée'}}
function setMotion(on){S.settings.motionOn=on;save();toast(on?'Mouvement activé':'Mouvement désactivé')}
function renderSensors(){const g=$('#geoStat');if(!g)return;if(!navigator.geolocation)g.innerHTML='Non supportée';else if(S.settings.geoOn===false)g.innerHTML='Désactivée';else if(SENS.geo.err==='refusée')g.innerHTML='Refusée';else if(SENS.geo.t&&Date.now()-SENS.geo.t<120000)g.innerHTML=`Active · ±${SENS.geo.acc} m`;else g.innerHTML='En attente…'}
setInterval(()=>{if($('#v-parametres').classList.contains('active'))renderSensors()},1000);

function locate(force){if(!navigator.geolocation){$('#locLabel').textContent='Indisponible';return}GEO.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};updateAddr();if(force)toast('Position mise à jour')},()=>{})}
function locateMyTrip(){toast('Recherche de votre parcours…');locate(true)}
function updateAddr(){$('#locLabel').textContent=pos?'Position OK':'Localisation…'}

/* Destinations */
function renderDests(){
  const el=$('#destList');if(!el)return;
  el.innerHTML=S.dests.length?S.dests.map((d,i)=>`<div class="res"><span>${TYPE_ICON[d.type]||'📍'}</span><div><div class="n">${esc(d.name)}</div><div class="a">${esc(d.addr||'')}</div></div><button class="del" onclick="removeDest(${i})">✕</button></div>`).join(''):'<div class="empty">Aucune destination</div>';
  const tiles=$('#tiles');
  if(tiles)tiles.innerHTML=S.dests.map((d,i)=>`<div class="tile glass" onclick="selectDest(${i})"><div class="ico">${TYPE_ICON[d.type]||'📍'}</div><div class="nm">${esc(d.name)}</div><div class="sub">${esc(d.addr||'')}</div></div>`).join('');
  $('#tilesEmpty').style.display=S.dests.length?'none':'';
}
function removeDest(i){S.dests.splice(i,1);save();renderDests()}
function selectDest(i){selDest=S.dests[i];openList();loadJourneys()}
function goAddFirst(){document.querySelector('#tabs button[data-v="parcours"]').click();$('#q').focus()}
function deselectTile(){selDest=null}

/* Recherche */
async function searchPlaces(q){
  if(!q||q.length<2)return[];
  try{const r=await fetch(`${API}/geocode?text=${encodeURIComponent(q)}&lang=fr`);if(!r.ok)return[];return await r.json()}catch{return[]}
}
$('#q').addEventListener('input',async e=>{
  const q=e.target.value.trim();
  if(q.length<2){$('#results').style.display='none';return}
  const res=await searchPlaces(q);
  $('#results').innerHTML=res.slice(0,8).map(r=>`<div class="res" onclick='addDest(${JSON.stringify(r).replace(/'/g,"&#39;")})'><span>${TYPE_ICON[r.type]||'📍'}</span><div><div class="n">${esc(r.name)}</div><div class="a">${esc(r.address||'')}</div></div></div>`).join('');
  $('#results').style.display='block';
});
function addDest(r){S.dests.push({name:r.name,addr:r.address,type:r.type,lat:r.lat,lon:r.lon,stopId:r.stopId});save();renderDests();toast('Destination ajoutée')}

/* Trajets */
async function loadJourneys(){
  if(!selDest)return;
  setListTitle();
  $('#journeys').innerHTML='<div class="spin"></div>';
  try{
    const from=pos?{lat:pos.lat,lon:pos.lon}:null;
    const to={lat:selDest.lat,lon:selDest.lon};
    const r=await fetch(`${API}/plan?from=${from?from.lat+','+from.lon:'null'}&to=${to.lat+','+to.lon}&numItineraries=8&lang=fr`);
    if(!r.ok)throw 0;
    const data=await r.json();
    const its=data.itineraries||[];
    lastJourneys=its;
    $('#journeys').innerHTML=its.map((it,i)=>{
      const leg=it.legs[0];const dur=mins(it.duration);
      return `<div class="jr glass" onclick="openJourney(${i})">
        <div class="jr-top">
          <div class="lb main" style="background:${leg.routeColor||'#e30613'}">${leg.route||'🚌'}</div>
          <div style="flex:1"><div style="font-weight:700">${esc(leg.headsign||leg.to?.name||'')}</div>
          <div style="font-size:12.5px;color:var(--muted)">${hm(leg.startTime)} → ${hm(it.endTime)} · ${dur} min</div></div>
          <div class="dep">${hm(leg.startTime)}</div>
        </div>
      </div>`;
    }).join('')||'<div class="empty">Aucun trajet trouvé</div>';
  }catch{$('#journeys').innerHTML='<div class="empty">Erreur de chargement</div>'}
}
function openJourney(i){const it=lastJourneys[i];if(!it)return;toast(`Départ à ${hm(it.legs[0].startTime)}`)}

/* Suivis */
function renderTracked(){
  const el=$('#tracked');if(!el)return;
  el.innerHTML=S.tracked.length?S.tracked.map((t,i)=>`<div class="jr glass" onclick="openTracked(${i})"><div class="jr-top"><div class="lb main" style="background:${t.color||'#e30613'}">${t.line||'🚌'}</div><div style="flex:1"><div>${esc(t.dir||'')}</div><div style="font-size:12px">${t.time||''}</div></div></div></div>`).join(''):'<div class="empty">Aucun suivi actif</div>';
}
function openTracked(i){const t=S.tracked[i];if(t)toast(`${t.line} → ${t.dir}`)}

/* Tickets */
async function renderSMS(){const el=$('#smsList');if(!el)return;el.innerHTML='<div class="empty">Aucun ticket disponible dans cette région</div>'}

/* Paramètres */
function toggleInfo(on){$('#infoView').classList.toggle('open',on)}
document.getElementById('themeSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('on',x===b));
  const v=b.dataset.v;
  if(v==='auto')v=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',v);
});

/* Carte */
let mlMap=null;
function closeMap(){document.getElementById('mapView').classList.remove('open')}

/* Init */
renderDests();renderTracked();renderSMS();renderSensors();
document.documentElement.setAttribute('data-theme',S.settings.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.settings.theme);
</script>
</body>
</html>
