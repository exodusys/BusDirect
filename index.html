<style>html.modal-open{overflow:hidden;overscroll-behavior:none;}
body.modal-open{position:fixed;left:0;right:0;width:100%;overflow:hidden;overscroll-behavior:none;}
.fixed.inset-0 .overflow-y-auto,.fixed.inset-4,.bdt-body{overscroll-behavior:contain;}
.bdt-follow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;border:1px solid rgba(239,68,68,.35);background:linear-gradient(135deg,rgba(239,68,68,.10),rgba(255,255,255,.7));color:#18181b;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.06);}

.bdt-follow:active{transform:scale(.99);}

html.dark .bdt-follow-s{color:#a1a1aa;}
.bdt-follow-go{font-size:22px;font-weight:700;flex:none;}

.bdt-wrap{display:flex;align-items:center;justify-content:center;}

 border-radius:28px 28px 0 0;background:var(--bg);border:1px solid var(--bd);color:var(--tx);box-shadow:0 -8px 40px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom);}

.bdt-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 10px;flex:none;}
.bdt-title{display:flex;align-items:center;gap:8px;}
.bdt-title h3{font-weight:700;font-size:17px;letter-spacing:-.02em;margin:0;}
.bdt-live{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite;}
.bdt-x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.bdt-x:active{transform:scale(.92);}
.bdt-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px;}
.bdt-card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.bdt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
.bdt-chips{display:flex;gap:6px;flex-wrap:wrap;}
.bdt-chip{color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
.bdt-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;}
.bdt-pill-ok{background:#ecfdf5;color:#059669;}
.bdt-pill-late{background:#fef2f2;color:#dc2626;}
html.dark .bdt-pill-ok{background:rgba(16,185,129,.15);color:#34d399;}
html.dark .bdt-pill-late{background:rgba(239,68,68,.18);color:#f87171;}
.bdt-trip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;}
.bdt-big{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}
.bdt-st{font-size:12px;color:var(--mu);margin-top:6px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.bdt-right{text-align:right;}
.bdt-mid{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px;}
.bdt-dur{font-size:11px;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums;}
.bdt-line{width:54px;height:3px;border-radius:3px;background:var(--ln);}
.bdt-sub{font-size:10px;color:var(--mu);}
.bdt-status{margin-top:14px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft);}
.bdt-sdot{width:10px;height:10px;border-radius:50%;background:#a1a1aa;flex:none;}
.bdt-run .bdt-sdot{background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.2);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite;}
.bdt-wait .bdt-sdot{background:#3b82f6;}
.bdt-done .bdt-sdot{background:#10b981;}
.bdt-s1{font-size:13px;font-weight:700;}
.bdt-s2{font-size:11px;color:var(--mu);margin-top:1px;}
.bdt-sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);}
.bdt-leg{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;}
.bdt-lg{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px;}
.bdt-lg-past{background:#a1a1aa;}.bdt-lg-live{background:#ef4444;}.bdt-lg-next{border:2px solid #a1a1aa;}
.bdt-list{position:relative;}
.bdt-row{--acc:#2563eb;position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px 0 10px 34px;}
.bdt-row:before{content:"";position:absolute;left:12px;top:0;bottom:0;width:3px;background:var(--ln);}
.bdt-row.is-first:before{top:20px;}
.bdt-row.is-last:before{bottom:calc(100% - 20px);}
.bdt-row.is-past:before{background:var(--acc);}
.bdt-row.is-live:before{background:linear-gradient(to bottom,var(--acc) 0,var(--acc) 22px,var(--ln) 22px);}
.bdt-dot{position:absolute;left:6px;top:11px;width:15px;height:15px;border-radius:50%;box-sizing:border-box;border:3px solid var(--ln);background:var(--card);z-index:1;}
.bdt-row.is-past .bdt-dot{background:var(--acc);border-color:var(--acc);}
.bdt-row.is-end .bdt-dot{width:19px;height:19px;left:4px;top:9px;border-color:var(--acc);}
.bdt-row.is-end.is-first .bdt-dot{background:var(--acc);}
.bdt-row.is-live .bdt-dot{background:#ef4444;border-color:var(--card);box-shadow:0 0 0 3px rgba(239,68,68,.35);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite;}
.bdt-row.is-mine:not(.is-live){background:linear-gradient(90deg,rgba(59,130,246,.08),transparent);border-radius:0 12px 12px 0;}
.bdt-main{flex:1;min-width:0;}
.bdt-name{font-size:13px;line-height:1.25;font-weight:500;}
.bdt-row.is-end .bdt-name,.bdt-row.is-live .bdt-name,.bdt-row.is-mine .bdt-name{font-weight:700;}
.bdt-row.is-past:not(.is-end) .bdt-name{color:var(--mu);}
.bdt-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.bdt-tags:empty{display:none;}
.bdt-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--mu);}
.bdt-tag-live{background:#ef4444;color:#fff;}
.bdt-tag-me{background:rgba(59,130,246,.14);color:#2563eb;}
html.dark .bdt-tag-me{color:#93c5fd;}
.bdt-plat{font-size:10px;color:var(--mu);font-weight:500;}
.bdt-time{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.bdt-t{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.bdt-del{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:#fef2f2;color:#dc2626;display:inline-flex;gap:5px;align-items:center;}
.bdt-del s{font-weight:500;opacity:.7;}
html.dark .bdt-del{background:rgba(239,68,68,.18);color:#f87171;}
.bdt-ok{font-size:9px;font-weight:600;color:#059669;}
html.dark .bdt-ok{color:#34d399;}
.bdt-xfer{display:flex;align-items:center;gap:8px;margin:4px 0 4px 34px;padding:8px 12px;border-radius:14px;font-size:12px;font-weight:600;background:#f5f3ff;color:#6d28d9;border:1px solid rgba(124,58,237,.18);}
.bdt-walk{background:#fffbeb;color:#b45309;border-color:rgba(217,119,6,.2);}
html.dark .bdt-xfer{background:rgba(124,58,237,.14);color:#c4b5fd;}
html.dark .bdt-walk{background:rgba(217,119,6,.14);color:#fcd34d;}
.bdt-xi{font-size:14px;}
.bdt-hdr{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:2px 0 2px 34px;}
.bdt-note{font-size:11px;color:var(--mu);text-align:center;padding-top:10px;}
.bdt-row.is-prev .bdt-name{font-style:normal;}
.bdt-fold{margin:0 0 4px;}
.bdt-fold>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-left:34px;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--mu);font-size:11px;font-weight:600;}
.bdt-fold>summary::-webkit-details-marker{display:none;}
.bdt-fold>summary:before{content:"▸";font-size:10px;}
.bdt-fold[open]>summary:before{content:"▾";}
.bdt-empty{font-size:13px;color:var(--mu);text-align:center;padding:14px 0;}
.bdt-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bdt-btn{height:48px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;}
.bdt-btn-main{background:#18181b;color:#fff;border-color:#18181b;}
html.dark .bdt-btn-main{background:#fafafa;color:#09090b;border-color:#fafafa;}
.bdt-btn:active{transform:scale(.98);}

/* V51 proximité */
.nearby-polish{background:linear-gradient(135deg,rgba(59,130,246,.06),rgba(255,255,255,.7));}
html.dark .nearby-polish{background:linear-gradient(135deg,rgba(37,99,235,.14),rgba(24,24,27,.92));}
</style><style id="bd-v96">
.bd-head{padding-top:8px;padding-bottom:6px;}
.bd-head-in{position:relative;padding-bottom:0;}
.bd-head-in>div:first-child{flex:1 1 auto;min-width:0;}
.bd-head-in>div:first-child>.min-w-0{flex:1 1 auto;min-width:0;}
.bd-addr{position:static;display:block;margin-top:4px;max-width:100%;height:14px;line-height:14px;font-size:11px;font-weight:500;color:#71717a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
html.dark .bd-addr{color:#a1a1aa;}
.bd-near{font-size:11px;font-weight:600;color:#52525b;margin-top:2px;}
html.dark .bd-near{color:#e4e4e7;}
.bd-manage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 2rem);max-width:520px;max-height:88dvh;overflow-y:auto;border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.25);padding:20px;z-index:80;-webkit-overflow-scrolling:touch;}
.bd-manage-head{margin:-20px -20px 12px;padding:20px 20px 12px;border-radius:28px 28px 0 0;}
.bd-tiles-head{margin:-16px -16px 12px;padding:16px 16px 12px;border-radius:20px 20px 0 0;}
.bd-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid #e7e5e4;}
html.dark .bd-acts{border-top-color:rgba(255,255,255,.1);}
.bd-act{height:44px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;background:#fff;border:1px solid #e7e5e4;color:inherit;}
html.dark .bd-act{background:#3f3f46;border-color:rgba(255,255,255,.1);}
.bd-act:active,.bd-del:active{transform:scale(.95);}
.bd-act-fav{background:#fbbf24 !important;color:#000;border-color:#fbbf24;}
.bd-del{grid-column:span 4;height:40px;border-radius:14px;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;}
html.dark .bd-del{background:rgba(239,68,68,.15);color:#f87171;}
html.dark .bd-wheel{fill:#ffffff !important;}
.bd-livebox{flex:1;min-width:0;padding:12px 16px;border-radius:16px;background:#18181b;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);}
html.dark .bd-livebox{background:#27272a;border:1px solid rgba(255,255,255,.1);}
</style>

<style id="bd-v118-relief">
/* V118 – relief des cadres en mode clair */
html:not(.dark) main > section,
html:not(.dark) main section > div[class*="rounded-[20px]"],

html:not(.dark) .nearby-polish{
  border-color:#d6d3d1 !important;
  box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 1px 2px rgba(0,0,0,.08),0 8px 18px -6px rgba(0,0,0,.16),0 20px 36px -16px rgba(0,0,0,.18) !important;
}
html:not(.dark) .bd-sms-rapides-row,
html:not(.dark) main [class*="rounded-[14px]"][class*="border"]{
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(0,0,0,.08),0 4px 10px -4px rgba(0,0,0,.14);
  border-color:#d6d3d1;
}
html:not(.dark) main [class*="rounded-[16px]"][class*="border"]{
  border-color:#d6d3d1;
}
</style>
<style id="bd-v118-arrive">.bd-arr-w{color:#18181b}html.dark .bd-arr-w{color:#fff}</style>
<style id="bd-v118-hamb">

.bd-head-in{padding-right:56px}
</style>

/** Résolution robuste des services SMS pour une ville (monde entier).
 *  Ordre: 1) city.sms explicite  2) byCityId  3) byNetwork  4) byCC  5) DEFAULT
 *  Normalise les noms (accents, casse) pour matching.
 */
function resolveSmsServices(city){
  if(!city) city={};
  var cc=(city.cc||"").toUpperCase();
  var net=(city.network||"").toUpperCase().replace(/\s+/g,"");
  var id=(city.id||"").toLowerCase();
  var name=(city.name||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  var result=null;
  var source="none";

  // 1) Données embarquées sur l'objet ville
  if(city.sms && (city.sms.number || (city.sms.keywords&&city.sms.keywords.length))){
    result={number:city.sms.number||"",keywords:city.sms.keywords||[],info:city.sms.info||"",active:city.sms.number!=="APP"&&!!city.sms.number};
    source="city.sms";
  }
  // 2) Registre par id
  if(!result && id && SMS_REGISTRY.byCityId[id]){
    var e=SMS_REGISTRY.byCityId[id];
    result={number:e.number,keywords:e.keywords||[],info:e.info||"",active:e.number!=="APP"&&!!e.number};
    source="byCityId";
  }
  // 3) Registre par réseau (match partiel)
  if(!result && net){
    var bn=SMS_REGISTRY.byNetwork;
    if(bn[net]){ result={number:bn[net].number,keywords:bn[net].keywords||[],info:bn[net].info||"",active:!!bn[net].active}; source="byNetwork"; }
    else {
      for(var k in bn){ if(net.indexOf(k)>=0||k.indexOf(net)>=0){ result={number:bn[k].number,keywords:bn[k].keywords||[],info:bn[k].info||"",active:!!bn[k].active}; source="byNetwork~"; break; } }
    }
  }
  // 4) Match nom de ville dans byCityId (slug)
  if(!result && name){
    var slug=name.replace(/[^a-z0-9]/g,"");
    if(SMS_REGISTRY.byCityId[slug]){
      var e2=SMS_REGISTRY.byCityId[slug];
      result={number:e2.number,keywords:e2.keywords||[],info:e2.info||"",active:e2.number!=="APP"&&!!e2.number};
      source="byCityId:name";
    }
  }
  // 5) Fallback pays
  if(!result){
    var pack=SMS_REGISTRY.byCC[cc]||SMS_REGISTRY.byCC.DEFAULT;
    result={number:pack.number||"APP",keywords:pack.keywords||[],info:pack.info||"",active:!!pack.active && pack.number!=="APP"};
    source="byCC";
  }
  result.source=source;
  result.cc=cc;
  result.network=city.network||"";
  result.cityName=city.name||"";
  return result;
}

function getTicketingForCity(city){
  if(!city) city={};
  var cc=(city.cc||"").toUpperCase();
  var country=(city.country||"").toLowerCase();
  var pack=TICKETING_BY_CC.DEFAULT;
  if(cc==="CH"||country.indexOf("suisse")>=0||country.indexOf("switzerland")>=0) pack=TICKETING_BY_CC.CH;
  else if(cc==="FR"||country.indexOf("france")>=0) pack=TICKETING_BY_CC.FR;
  else if(cc==="DE"||country.indexOf("deutsch")>=0||country.indexOf("germany")>=0||country.indexOf("allemagne")>=0) pack=TICKETING_BY_CC.DE;
  else if(cc==="BE"||country.indexOf("belgi")>=0) pack=TICKETING_BY_CC.BE;
  else if(cc==="NL"||country.indexOf("nether")>=0||country.indexOf("pays-bas")>=0) pack=TICKETING_BY_CC.NL;
  else if(cc==="GB"||cc==="UK"||country.indexOf("united")>=0) pack=TICKETING_BY_CC.GB;
  else if(cc==="ES"||country.indexOf("espagne")>=0||country.indexOf("spain")>=0) pack=TICKETING_BY_CC.ES;
  else if(cc==="IT"||country.indexOf("ital")>=0) pack=TICKETING_BY_CC.IT;

  var sms=resolveSmsServices(city);
  var services=[];
  var num=sms.number||"";
  var kws=sms.keywords||[];
  var isAppOnly=(num==="APP"||!num);
  var discFR=(cc==="FR"||country.indexOf("france")>=0) && false; /* TAB-SMS encore actif sur bus IDF et nombreuses agglo */

  if(!isAppOnly && num && kws.length){
    kws.forEach(function(code){
      services.push({
        cat:"sms",
        name:(city.network||sms.network||"SMS")+" • "+code,
        desc:(sms.info||("Envoyer \""+code+"\" au "+num)),
        number:num,
        code:code,
        action:"sms",
        badge:sms.active?"SMS":"SMS ?",
        discontinued:!sms.active
      });
    });
  } else if(isAppOnly){
    services.push({cat:"info",name:(city.network||"Réseau")+" — pas de SMS",desc:sms.info||"Utiliser l'application officielle du réseau",action:"info",badge:"App only"});
  }

  (pack.apps||[]).forEach(function(a){
    services.push({cat:"app",name:a.name,desc:a.desc,url:a.url,action:"store",badge:"App 2026"});
  });
  (pack.contactless||[]).forEach(function(a){
    services.push({cat:"contactless",name:a.name,desc:a.desc,action:"contactless",badge:"Sans contact"});
  });

  return {
    city:city,
    services:services,
    note:sms.info||pack.note||"",
    smsNumber:num,
    smsCodes:kws,
    network:city.network||"",
    smsSource:sms.source,
    smsActive:!!sms.active
  };
}

<script id="bd-v102-live-source-script">
(function(){
  var liveSources=new Map();
  function isScheduleUrl(u){
    u=String(u||'');
    return /transport\.opendata\.ch\/v1\/(?:connections|stationboard)/i.test(u) || /(?:gtfs-rt|gtfsrt|realtime|tripupdates|vehiclepositions|servicealerts)/i.test(u);
  }
  function sourceName(u){
    try{
      var x=new URL(String(u),location.href), host=x.hostname.replace(/^www\./,'');
      var cfg=(window.__bd_sources||[]).find(function(s){try{return s&&s.url&&new URL(s.url,location.href).hostname===x.hostname}catch(e){return false}});
      return cfg&&cfg.name?cfg.name:host;
    }catch(e){return String(u||'Source horaires')}
  }
  function mark(u,ok){
    if(!isScheduleUrl(u)||ok===false)return;
    var name=sourceName(u); liveSources.set(name,{name:name,url:String(u),at:Date.now()});
    window.__bd_liveSources=Array.from(liveSources.values()); render();
  }
  try{
    performance.getEntriesByType('resource').forEach(function(e){if(e&&isScheduleUrl(e.name))mark(e.name,true)});
  }catch(e){}
  try{
    var originalFetch=window.fetch;
    if(originalFetch&&!originalFetch.__bdv102){
      var wrapped=function(input,init){
        var u=typeof input==='string'?input:(input&&input.url)||'';
        return originalFetch.apply(this,arguments).then(function(r){if(r&&r.ok)mark(u,true);return r});
      };
      wrapped.__bdv102=true; window.fetch=wrapped;
    }
  }catch(e){}
  function findRecognized(){
    var els=document.querySelectorAll('.bd-livebox div, .bd-livebox span');
    for(var i=0;i<els.length;i++) if(/^\s*Dalle reconnue\s*:/i.test(els[i].textContent||'')) return els[i];
    return null;
  }
  function removeConnectionsBox(rec){
    if(!rec)return;
    var row=rec.closest('.flex.items-center.justify-between');
    if(!row)return;
    Array.from(row.children).forEach(function(ch){
      if(ch.contains(rec))return;
      var txt=(ch.textContent||'').trim();
      if(/\bconnexions?\b/i.test(txt)) ch.remove();
    });
  }
  function render(){
    var rec=findRecognized(); if(!rec)return;
    removeConnectionsBox(rec);
    var box=rec.parentElement; if(!box)return;
    var old=box.querySelector('.bd-v102-live-sources');
    var list=Array.from(liveSources.values()).sort(function(a,b){return a.at-b.at});
    if(!list.length){if(old)old.remove();return;}
    if(!old){old=document.createElement('div');old.className='bd-v102-live-sources';box.appendChild(old)}
    old.innerHTML='';
    list.forEach(function(s){
      var row=document.createElement('div');row.className='bd-v102-live-source-row';
      var dot=document.createElement('span');dot.className='bd-v102-live-source-dot';
      var name=document.createElement('span');name.className='bd-v102-live-source-name';name.textContent='Source horaires : '+s.name;
      row.appendChild(dot);row.appendChild(name);old.appendChild(row);
    });
  }
  var mo=new MutationObserver(function(){clearTimeout(window.__bdv102t);window.__bdv102t=setTimeout(render,20)});
  function start(){render();if(document.body)mo.observe(document.body,{subtree:true,childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
  window.addEventListener('bd-sources-change',render);
})();
</script>

<script id="bd-v104-sms-cleanup-script">
(function(){
  function hideSmsExtras(){
    document.querySelectorAll('section').forEach(function(sec){
      var h = sec.querySelector('h3');
      if(!h) return;
      var t = (h.textContent||'').trim();
      if(t.indexOf('Ticket SMS') < 0 && t.indexOf('SMS') < 0) return;
      // Hide "Ville active" info block
      sec.querySelectorAll('div').forEach(function(d){
        var tx = (d.textContent||'');
        if(d.children.length <= 3 && /Ville active\s*:/i.test(tx) && tx.length < 200){
          d.style.display = 'none';

      });
      // Hide Raccourcis SMS block
      sec.querySelectorAll('div').forEach(function(d){
        var first = d.firstElementChild;
        if(first && /Raccourcis SMS/i.test(first.textContent||'')){
          d.style.display = 'none';
        }
      });
      // Hide download shortcut block
      sec.querySelectorAll('div').forEach(function(d){
        var tx = (d.textContent||'');
        if(/Export Shortcut|Export Tasker|iOS|Tasker/i.test(tx) && /download|raccourci|shortcut|télécharger/i.test(tx)){
          // check if it's the download header area
        }
        var bold = d.querySelector('.font-bold, [class*="font-bold"]');

          var block = bold.closest('[class*="rounded"]') || d;
          if(block && block !== sec) block.style.display = 'none';
        }
      });
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSmsExtras, 50); });
  else setTimeout(hideSmsExtras, 50);
  var mo = new MutationObserver(function(){ clearTimeout(window.__bdSmsHideT); window.__bdSmsHideT = setTimeout(hideSmsExtras, 40); });

})();

  function applyOfficialCoverage(list){
    if(!Array.isArray(list)) return list;
    list.forEach(function(s){
      var off=OFFICIAL_SMS_COVERAGE[s.id];
      if(!off) return;
      if(off.tickets) s.tickets=off.tickets.slice();
      if(off.keywords) s.keywords=off.keywords.slice();
      if(off.info) s.info=off.info;
      if(off.number) s.number=off.number;
      if(off.name) s.name=off.name;
      s.coverageUpdatedAt=Date.now();
      s.coverageOfficial=true;
    });
    return list;
  }

  function load(){
    try{
      var a=JSON.parse(localStorage.getItem('bd_sms_sources_v1')||'null');
      if(Array.isArray(a)&&a.length){
        SMS_DEFAULTS.forEach(function(d){
          var existing=a.find(function(x){return x.id===d.id});
          if(!existing){
            a.push(Object.assign({},d,{active:false,manual:false}));
          } else {
            if(d.tickets) existing.tickets=d.tickets;
            if(d.keywords) existing.keywords=d.keywords;
            if(d.info) existing.info=d.info;
            if(d.number) existing.number=d.number;
            if(d.name) existing.name=d.name;
          }
        });
        return applyOfficialCoverage(a);
      }
    }catch(e){}
    return applyOfficialCoverage(SMS_DEFAULTS.map(function(x){return Object.assign({},x,{active:!!x.auto,manual:false,status:x.auto?'ok':''})}));
  }
  var sources=load();
  function save(){
    try{localStorage.setItem('bd_sms_sources_v1',JSON.stringify(sources))}catch(e){}
    window.__bd_sms_sources=sources;
    window.dispatchEvent(new CustomEvent('bd-sms-sources-change',{detail:sources}));
    applyHomeSmsFilter();
  }
  window.__bd_sms_sources=sources;

  function getActiveCity(){
    try{
      // Try React-ish globals / localStorage
      var id=localStorage.getItem('bd_city')||localStorage.getItem('bd-city')||'';
      var name='';
      var cc='';
      // Scan city button or known markers
      var btn=document.getElementById('bd-city-btn');
      if(btn) name=(btn.textContent||'').trim();
      // From window cities list if available
      var all=window.__bd_allCities||[];
      var found=all.find(function(c){return c&&(c.id===id||c.name===name)});
      if(found) return found;
      return {id:id,name:name,cc:cc,country:''};
    }catch(e){return {}}
  }

  function autoSync(){
    if(localStorage.getItem('bd_sms_autodetect')==='0') return;
    var city=getActiveCity();
    var cc=(city.cc||'').toUpperCase();
    var cid=(city.id||'').toLowerCase();
    var cname=(city.name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    var country=(city.country||'').toLowerCase();
    sources.forEach(function(s){
      if(s.manual) return; // user override — keep current active state
      var match=false;
      // Strict: only activate when source lists this city (no country-wide auto)
      if(s.cities&&s.cities.length && (cid||cname)){
        match=s.cities.some(function(x){
          x=String(x).toLowerCase();
          return x===cid || (cname&&(cname.indexOf(x)>=0||x.indexOf(cname)>=0));
        });
      }
      // Network hint on city object
      if(!match&&s.network&&city.network&&String(city.network).toUpperCase().indexOf(String(s.network).toUpperCase())>=0) match=true;
      s.active=!!match;
      s.status=s.active?'ok':'';
    });
    save();
  }

  function esc(s){return String(s||'').replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}

  function renderList(){
    var box=document.getElementById('bd-v104-sms-list');
    if(!box) return;
    var city=getActiveCity();
    box.innerHTML=sources.map(function(s,i){
      var st=s.active?'ok':'';
      var badge=s.manual?(s.active?'manuel':'off'):(s.active?'auto':'');
      var badgeTxt=s.manual?(s.active?'manuel':'désactivé'):(s.active?'auto':'inactif');
      var cov=(s.coverageOfficial||(s.tickets&&s.tickets.length>2))?'<span class="bd-v104-sms-badge auto">officiel</span>':'';
      var nTickets=s.tickets&&s.tickets.length?(' · '+s.tickets.length+' billets'):'';
      return '<div class="bd-v104-sms-row"><span class="bd-v104-sms-dot '+st+'"></span><div><div class="bd-v104-sms-name">'+esc(s.name)+
        (badge?'<span class="bd-v104-sms-badge '+(s.active&&!s.manual?'auto':'')+'">'+esc(badgeTxt)+'</span>':'')+
        cov+
        '</div><div class="bd-v104-sms-sub">'+esc(s.info||'')+' · '+esc(s.number&&s.number!=='APP'?'SMS '+s.number:'App')+
        nTickets+
        '</div></div><button class="bd-v104-sms-toggle '+(s.active?'on':'')+'" data-sms-toggle="'+i+'" aria-label="toggle"><span class="bd-v104-sms-knob"></span></button></div>';
    }).join('');
  }

          {id:'ch-zvv',name:'ZVV Zurich',cc:'CH',network:'ZVV',number:'988',keywords:['ZVV'],info:'SMS ZVV Zurich',cities:['zurich'],auto:true},
          {id:'ch-bern',name:'Bernmobil',cc:'CH',network:'BERNMOBIL',number:'788',keywords:['BERN'],info:'SMS Bernmobil',cities:['berne','bern'],auto:true},
          {id:'ch-bvb',name:'BVB Bâle',cc:'CH',network:'BVB',number:'788',keywords:['BVB'],info:'SMS BVB Bâle',cities:['bale','basel'],auto:true},
          {id:'ch-national',name:'SMS Suisse (788/873/988)',cc:'CH',network:'CH',number:'788',keywords:['SMS'],info:'Réseaux SMS suisses encore actifs',cities:[],auto:true},
          {id:'fr-ratp',name:'RATP / IDFM Paris',cc:'FR',network:'RATP',number:'93100',keywords:['BUS63','RATP'],info:'Historique SMS Paris',cities:['paris'],auto:true},
          {id:'fr-tcl',name:'TCL Lyon',cc:'FR',network:'TCL',number:'93400',keywords:['TCL'],info:'SMS TCL Lyon',cities:['lyon'],auto:true},

          if(sources.some(function(x){return x.id===d.id})) return;
          // Prefer relevant to city, but add all discovered from "web catalog"
          var rel=true;
          if(cityName&&d.cities&&d.cities.length){

      openPanel();

  // Filter homepage Ticket SMS cards based on active sources
  function applyHomeSmsFilter(){
    var active=sources.filter(function(s){return s.active});
    var keywords=[];
    active.forEach(function(s){
      (s.keywords||[]).forEach(function(k){keywords.push(String(k).toUpperCase())});
      if(s.network) keywords.push(String(s.network).toUpperCase());
      if(s.number&&s.number!=='APP') keywords.push(String(s.number));
    });
    document.querySelectorAll('section').forEach(function(sec){
      var h=sec.querySelector('h3');
      if(!h||!/Ticket SMS|SMS/i.test(h.textContent||'')) return;
      var cards=sec.querySelectorAll('[class*="rounded"]');
      cards.forEach(function(card){
        if(card===sec) return;
        var tx=(card.textContent||'').toUpperCase();
        // Don't hide headers
        if(card.querySelector('h3')) return;
        if(!keywords.length){ card.style.display=''; return; }
        var ok=keywords.some(function(k){return k&&tx.indexOf(k)>=0});
        // Keep empty-state messages
        if(/Aucun service SMS/i.test(card.textContent||'')) ok=true;
        card.style.display=ok?'':'none';
      });
    });
  }

  function run(){
    wireMenu();
    // Initial auto sync if no manual prefs saved
    try{
      var raw=localStorage.getItem('bd_sms_sources_v1');
      if(!raw) autoSync();
      else applyHomeSmsFilter();
    }catch(e){autoSync()}

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run);

  setInterval(wireMenu,1500);
  var mo=new MutationObserver(function(){clearTimeout(window.__bdSmsSrcT);window.__bdSmsSrcT=setTimeout(function(){wireMenu();applyHomeSmsFilter()},50)});
  setTimeout(function(){if(document.body)mo.observe(document.body,{childList:true,subtree:true})},200);
  window.addEventListener('bd-sms-sources-change',applyHomeSmsFilter);
  // Re-sync when city button text changes
  setInterval(function(){
    try{
      var btn=document.getElementById('bd-city-btn');
      var name=btn?(btn.textContent||'').trim():'';
      if(window.__bd_lastCityName!==name){
        window.__bd_lastCityName=name;
        var anyManual=sources.some(function(s){return s.manual});
        if(!anyManual) autoSync();
        else applyHomeSmsFilter();
      }
    }catch(e){}
  },2000);
})();

<script id="bd-v104-sms-rapides-script">
(function(){
  function hideTicketSmsSection(){
    document.querySelectorAll('section').forEach(function(sec){
      var h=sec.querySelector('h3');
      if(!h) return;
      if(/Ticket SMS|SMS —/i.test(h.textContent||'')){
        sec.style.display='none';
        sec.setAttribute('data-bd-hidden-ticket','1');
      }
    });
  }

  function normalizeCity(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }
  function sourceMatchesCity(s, cityName){
    var cname=normalizeCity(cityName);
    if(!cname) return false;
    if(s.cities&&s.cities.length){
      return s.cities.some(function(x){
        x=normalizeCity(x);
        return x&&(cname.indexOf(x)>=0||x.indexOf(cname)>=0);
      });
    }
    return false;
  }
  function activeSmsSources(){
    var list=window.__bd_sms_sources||[];
    var city=cityLabel();
    return list.filter(function(s){
      if(!s||!s.active||!s.number||s.number==='APP') return false;
      // Homepage: only services for the current city
      return sourceMatchesCity(s, city);
    });
  }

  function cityLabel(){
    var b=document.getElementById('bd-city-btn');
    return b?((b.textContent||'').trim()||''):'';
  }

  function ticketList(s){
    // 100% des billets officiels — jamais de troncature
    if(s.tickets&&s.tickets.length) return s.tickets;
    var codes=s.keywords||[];
    if(!codes.length) codes=['SMS'];
    return codes.map(function(c){return {code:c,label:s.info||('SMS au '+s.number)}});
  }
  function renderRapides(){
    hideTicketSmsSection();
    var host=document.getElementById('bd-sms-rapides');
    if(!host){
      host=document.createElement('div');
      host.id='bd-sms-rapides';
      host.className='bd-sms-rapides';
      var root=document.getElementById('root')||document.body;
      var sections=root.querySelectorAll('section');
      var last=sections[sections.length-1];
      if(last&&last.parentElement){
        last.parentElement.appendChild(host);
      } else {
        root.appendChild(host);
      }
    }
    var srcs=activeSmsSources();
    var city=cityLabel()||'Ville';
    // No SMS for this city → hide the whole block (no empty message)
    if(!srcs.length){
      host.innerHTML='';
      host.style.display='none';
      return;
    }
    host.style.display='';
    var rows=[];
    srcs.forEach(function(s){
      ticketList(s).forEach(function(t){
        var code=t.code||'SMS';
        var label=t.label||s.info||('SMS au '+s.number);
        var href='sms:'+s.number+'?body='+encodeURIComponent(code);
        rows.push('<div class="bd-sms-rapides-row"><div><div class="bd-sms-rapides-name">'+code+' · '+label+'</div>'+
          '<div class="bd-sms-rapides-desc">Source : '+(s.name||'')+(s.number&&s.number!=='APP'?' · SMS '+s.number:'')+'</div></div>'+
          '<a class="bd-sms-rapides-btn" href="'+href+'">'+code+'</a></div>');
      });
    });
    var shown=Math.min(rows.length,window.__bd_smsShown||3);
    var html='<div class="bd-sms-rapides-card"><div class="bd-sms-rapides-title">⚡ SMS rapides <span style="font-weight:500;font-size:11px;color:#71717a">· '+city+'</span></div>';
    html+='<div class="bd-sms-rapides-list">'+rows.slice(0,shown).join('')+'</div>';
    if(shown<rows.length){
      html+='<button type="button" class="bd-sms-more" data-bd-sms-more="1">Afficher '+Math.min(5,rows.length-shown)+' de plus</button>';
    }
    html+='</div>';
    if(host.__bdHtml===html) return;
    host.__bdHtml=html;
    host.innerHTML=html;
  }
  document.addEventListener('click',function(ev){
    var b=ev.target.closest&&ev.target.closest('[data-bd-sms-more]');
    if(!b) return;
    window.__bd_smsShown=(window.__bd_smsShown||3)+5;
    renderRapides();
  });

  function ensureAutoDetectButtons(){
    // Sources panel
    var srcList=document.getElementById('bd-v101-list');
    if(srcList&&!document.getElementById('bd-auto-detect-sources')){
      var actions=srcList.parentElement&&srcList.parentElement.querySelector('.bd-v101-actions');
      var btn=document.createElement('button');
      btn.id='bd-auto-detect-sources';
      btn.className='bd-auto-detect-btn';
      var on=localStorage.getItem('bd_sources_autodetect')!=='0';
      btn.textContent=on?'✓ Détection automatique active':'Activer la détection automatique';
      btn.classList.toggle('on',on);
      btn.onclick=function(){
        var cur=localStorage.getItem('bd_sources_autodetect')!=='0';
        localStorage.setItem('bd_sources_autodetect',cur?'0':'1');
        var n=localStorage.getItem('bd_sources_autodetect')!=='0';
        btn.textContent=n?'✓ Détection automatique active':'Activer la détection automatique';
        btn.classList.toggle('on',n);
        if(n) window.dispatchEvent(new CustomEvent('bd-sources-autodetect'));
      };
      if(actions) actions.parentElement.insertBefore(btn, actions.nextSibling);
      else srcList.parentElement.insertBefore(btn, srcList);
    }
    // SMS panel
    var smsList=document.getElementById('bd-v104-sms-list');
    if(smsList&&!document.getElementById('bd-auto-detect-sms')){
      var note=smsList.parentElement&&smsList.parentElement.querySelector('.bd-v104-sms-note');
      var btn2=document.createElement('button');
      btn2.id='bd-auto-detect-sms';
      btn2.className='bd-auto-detect-btn';
      var on2=localStorage.getItem('bd_sms_autodetect')!=='0';
      btn2.textContent=on2?'✓ Détection automatique active':'Activer la détection automatique';
      btn2.classList.toggle('on',on2);
      btn2.onclick=function(){
        var cur=localStorage.getItem('bd_sms_autodetect')!=='0';
        localStorage.setItem('bd_sms_autodetect',cur?'0':'1');
        var n=localStorage.getItem('bd_sms_autodetect')!=='0';
        btn2.textContent=n?'✓ Détection automatique active':'Activer la détection automatique';
        btn2.classList.toggle('on',n);
        if(n){
          // clear manual flags and sync
          try{
            var src=window.__bd_sms_sources||[];
            src.forEach(function(s){s.manual=false});
            window.dispatchEvent(new CustomEvent('bd-sms-sources-change',{detail:src}));
          }catch(e){}
          var sync=document.getElementById('bd-v104-sms-autosync');
          if(sync) sync.click();
        }
      };
      if(note) note.parentElement.insertBefore(btn2, note.nextSibling);
      else smsList.parentElement.insertBefore(btn2, smsList);
    }
  }

  function run(){
    hideTicketSmsSection();
    renderRapides();
    ensureAutoDetectButtons();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(run,80)});
  else setTimeout(run,80);
  var mo=new MutationObserver(function(){
    clearTimeout(window.__bdRapidesT);
    window.__bdRapidesT=setTimeout(function(){hideTicketSmsSection();renderRapides();ensureAutoDetectButtons()},60);
  });
  setTimeout(function(){if(document.body)mo.observe(document.body,{childList:true,subtree:true})},150);
  window.addEventListener('bd-sms-sources-change',function(){setTimeout(renderRapides,30)});
})();
</script>

<script id="bd-v104-autodetect-wire">
(function(){
  function wire(){
    var s=document.getElementById('bd-auto-detect-sources');
    if(s && !s.dataset.wired){
      s.dataset.wired='1';
      function refresh(){
        var on=localStorage.getItem('bd_sources_autodetect')!=='0';
        s.textContent=on?'✓ Détection automatique active':'Activer la détection automatique';
        s.classList.toggle('on',on);
      }
      refresh();
      s.addEventListener('click',function(){
        var cur=localStorage.getItem('bd_sources_autodetect')!=='0';
        localStorage.setItem('bd_sources_autodetect',cur?'0':'1');
        refresh();
        if(!cur){ // was off, now on
          window.dispatchEvent(new CustomEvent('bd-sources-autodetect'));
        }
      });
    }
    var m=document.getElementById('bd-auto-detect-sms');
    if(m && !m.dataset.wired){
      m.dataset.wired='1';
      function refresh2(){
        var on=localStorage.getItem('bd_sms_autodetect')!=='0';
        m.textContent=on?'✓ Détection automatique active':'Activer la détection automatique';
        m.classList.toggle('on',on);
      }
      refresh2();
      m.addEventListener('click',function(){
        var cur=localStorage.getItem('bd_sms_autodetect')!=='0';
        localStorage.setItem('bd_sms_autodetect',cur?'0':'1');
        refresh2();
        if(!cur){
          try{
            var src=window.__bd_sms_sources||[];
            src.forEach(function(x){x.manual=false});
          }catch(e){}
          var sync=document.getElementById('bd-v104-sms-autosync');
          if(sync) sync.click();
        }
      });
    }
  }
  setInterval(wire,800);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',wire);
  else wire();
})();
</script>

<script id="bd-v118-hamb-hide-script">
(function(){
  var SEL='.fixed.inset-0, .bd-manage, .bdt-sheet, .bd-v101-overlay.open, .bd-v104-sms-overlay.open';
  var raf=0;
  function check(){
    raf=0;
    var open=false;
    try{open=!!document.querySelector(SEL)}catch(e){}
    document.documentElement.classList.toggle('bd-page-open',open);
  }
  function sched(){ if(!raf) raf=requestAnimationFrame(check); }
  function start(){
    check();
    new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded',start);
})();
</script>

<script id="bd-v145-dateheure-script">
(function(){
  function pad(n){return String(n).padStart(2,'0')}
  function init(box){var d=new Date(),di=box.querySelector('#bd-trip-date'),ti=box.querySelector('#bd-trip-time');if(di&&!di.value)di.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());if(ti&&!ti.value)ti.value=pad(d.getHours())+':'+pad(d.getMinutes());save()}
  function save(){var d=document.getElementById('bd-trip-date'),t=document.getElementById('bd-trip-time');window.__bd_tripDate=d?d.value:null;window.__bd_tripTime=t?t.value:null;if(d&&t)window.dispatchEvent(new CustomEvent('bd-trip-datetime-change',{detail:{date:d.value,time:t.value}}))}
  function clearButton(){return Array.from(document.querySelectorAll('button')).find(function(b){return (b.textContent||'').trim().includes('Effacer la recherche')})||null}
  function sync(){
    var clear=clearButton(),box=document.getElementById('bd-dateheure-rubrique');
    if(clear){
      if(!box){box=document.createElement('div');box.id='bd-dateheure-rubrique';box.innerHTML='<div class="bd-dh-head"><div class="bd-dh-icon">🗓️</div><div><div class="bd-dh-title">Date et heure de départ</div><div class="bd-dh-sub">Consulter les horaires passés ou futurs</div></div></div><div class="bd-dh-grid"><div><label for="bd-trip-date">Date</label><input id="bd-trip-date" type="date" aria-label="Date de départ"></div><div><label for="bd-trip-time">Heure</label><input id="bd-trip-time" type="time" aria-label="Heure de départ"></div></div>';box.addEventListener('change',save);init(box)}
      if(clear.parentNode && box.nextSibling!==clear) clear.parentNode.insertBefore(box,clear);
    }else if(box){box.remove();window.__bd_tripDate=null;window.__bd_tripTime=null}
  }
  var raf=0;function schedule(){if(!raf)raf=requestAnimationFrame(function(){raf=0;sync()})}
  function start(){sync();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,characterData:true});document.addEventListener('input',schedule,true);document.addEventListener('change',schedule,true)}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
</script>
