<script id="bd-v194-saved-live-script">
(function(){
'use strict';

var STORAGE_KEY = 'bd_saved_live_v1';
var DEFAULT_HOURS = 3;

/* ---------- Durée configurable (page Distances) ---------- */
function getSavedHours(){
  try{
    var v = parseInt(localStorage.getItem('bd_savedLiveHours') || '', 10);
    if(!isNaN(v) && v >= 1 && v <= 72) return v;
  }catch(e){}
  return DEFAULT_HOURS;
}
function setSavedHours(h){
  try{ localStorage.setItem('bd_savedLiveHours', String(h)); }catch(e){}
  window.__bd_savedLiveHours = h;
}
window.__bd_savedLiveHours = getSavedHours();

/* ---------- Stockage ---------- */
function loadSaved(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    var a = JSON.parse(raw);
    if(!Array.isArray(a)) return [];
    // purge : fin + N heures
    var hours = getSavedHours();
    var now = Date.now();
    var kept = a.filter(function(item){
      if(!item || !item.endMs) return false;
      return (item.endMs + hours*3600*1000) > now;
    });
    if(kept.length !== a.length) saveSaved(kept);
    return kept;
  }catch(e){ return []; }
}
function saveSaved(list){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
  window.dispatchEvent(new CustomEvent('bd-saved-live-change', {detail: list}));
}
function isSaved(conn){
  try{
    var list = loadSaved();
    var key = connKey(conn);
    return list.some(function(x){ return x.key === key; });
  }catch(e){ return false; }
}
function connKey(conn){
  if(!conn) return '';
  var from = (conn.from && conn.from.station) || conn._fromStop || '';
  var dep = (conn.from && conn.from.departure) || '';
  var prods = (conn.products || []).join(',');
  return from + '|' + dep + '|' + prods;
}

/* Estime l'heure de fin du parcours */
function computeEndMs(conn){
  try{
    if(conn.to && conn.to.actualMs) return conn.to.actualMs;
    if(conn.to && conn.to.arrival){
      var t = new Date(conn.to.arrival).getTime();
      if(!isNaN(t)) return t + ((conn.to.delay||0)*60000);
    }
    // fallback : passList dernier arrêt
    var pls = (conn.passList||[]).filter(function(x){return x && (x.type==='stop' || !x.type);});
    if(pls.length){
      var last = pls[pls.length-1];
      var tt = last.arrival || last.departure;
      if(tt){
        var ms = new Date(tt).getTime();
        if(!isNaN(ms)) return ms + ((last.delay||0)*60000);
      }
    }
    // fallback : départ + durée
    if(conn.from && conn.from.departure){
      var d = new Date(conn.from.departure).getTime() + ((conn.from.delay||0)*60000);
      var dur = parseDuration(conn.duration);
      return d + dur*60000;
    }
  }catch(e){}
  return Date.now() + 3600000;
}
function parseDuration(s){
  try{
    var m = String(s||'').match(/(\d+)/);
    return m ? parseInt(m[1],10) : 60;
  }catch(e){ return 60; }
}

/* ---------- API globale ---------- */
window.__bd_saveLive = function(conn, meta){
  if(!conn) return false;
  try{
    var list = loadSaved();
    var key = connKey(conn);
    if(list.some(function(x){ return x.key === key; })) return true;

    var prods = (conn.products||[]).filter(Boolean);
    var fromName = (conn.from && conn.from.station) || conn._fromStop || 'Départ';
    var toName = (conn.to && conn.to.station) || 'Arrivée';
    var depTime = (conn.from && conn.from.time) || '';
    var arrTime = (conn.to && conn.to.time) || '';
    var depMs = (conn.from && conn.from.actualMs) || Date.now();
    var endMs = computeEndMs(conn);

    // nettoyage minimal des données
    var cleanPassList = (conn.passList||[]).map(function(p){
      return {
        type: p.type || 'stop',
        station: (typeof p.station === 'string') ? p.station : (p.station && p.station.name) || '',
        arrival: p.arrival || null,
        departure: p.departure || null,
        delay: p.delay || 0,
        platform: p.platform || '',
        category: p.category || '',
        line: p.line || '',
        lat: p.lat != null ? p.lat : null,
        lon: p.lon != null ? p.lon : null,
        walkMin: p.walkMin || 0,
        sectionIdx: p.sectionIdx
      };
    });

    var entry = {
      key: key,
      id: 'sl_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      savedAt: Date.now(),
      startMs: depMs,
      endMs: endMs,
      from: {
        station: fromName,
        time: depTime,
        departure: conn.from && conn.from.departure || null,
        delay: (conn.from && conn.from.delay) || 0,
        platform: (conn.from && conn.from.platform) || ''
      },
      to: {
        station: toName,
        time: arrTime,
        arrival: conn.to && conn.to.arrival || null,
        delay: (conn.to && conn.to.delay) || 0
      },
      duration: conn.duration || '',
      products: prods,
      transfers: conn.transfers || 0,
      passList: cleanPassList,
      fromStop: conn._fromStop || fromName,
      originQuery: conn.originQuery || '',
      destQuery: conn.destQuery || ''
    };
    list.push(entry);
    // limite 20
    if(list.length > 20) list = list.slice(-20);
    saveSaved(list);
    return true;
  }catch(e){
    return false;
  }
};

window.__bd_unsaveLive = function(conn){
  try{
    var key = connKey(conn);
    var list = loadSaved().filter(function(x){ return x.key !== key; });
    saveSaved(list);
    return true;
  }catch(e){ return false; }
};

window.__bd_toggleSaveLive = function(conn, meta){
  if(!conn) return false;
  if(isSaved(conn)){
    window.__bd_unsaveLive(conn);
    toast('❌ Suivi retiré');
    return false;
  } else {
    var ok = window.__bd_saveLive(conn, meta);
    if(ok){
      var h = getSavedHours();
      toast('✅ Suivi sauvegardé · garde ' + h + ' h');
    } else {
      toast('⚠️ Sauvegarde impossible');
    }
    return ok;
  }
};

/* ---------- Toast ---------- */
var toastTimer = null;
function toast(msg){
  var old = document.getElementById('bd194-toast');
  if(old) old.remove();
  var d = document.createElement('div');
  d.id = 'bd194-toast';
  d.className = 'bd194-toast';
  d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ d.remove(); }, 2200);
}

/* ---------- Injection boutons "Enregistrer" ---------- */

/* Bouton sur Suivi en direct (page .bdt-sheet) */
function injectLiveSaveButton(){
  var sheet = document.querySelector('.bdt-sheet');
  if(!sheet) return;
  if(sheet.querySelector('.bd194-save-btn')) return;

  // Récupère la connexion courante depuis le suivi
  var conn = getCurrentLiveConn();
  if(!conn) return;

  // Cherche la zone d'actions
  var actions = sheet.querySelector('.bdt-actions');
  if(!actions) return;

  var saved = isSaved(conn);
  var btn = document.createElement('button');
  btn.className = 'bd194-save-btn' + (saved ? ' is-saved' : '');
  btn.innerHTML = '<span class="bd194-save-icon">' + (saved ? '✓' : '🔖') + '</span><span class="bd194-save-lbl">' + (saved ? 'Suivi sauvegardé' : 'Enregistrer ce suivi') + '</span>';
  btn.onclick = function(e){
    e.preventDefault();
    e.stopPropagation();
    var wasSaved = isSaved(conn);
    var nowSaved = window.__bd_toggleSaveLive(conn, {cardEl: sheet});
    btn.classList.toggle('is-saved', nowSaved);
    btn.querySelector('.bd194-save-icon').textContent = nowSaved ? '✓' : '🔖';
    btn.querySelector('.bd194-save-lbl').textContent = nowSaved ? 'Suivi sauvegardé' : 'Enregistrer ce suivi';
    if(nowSaved) toast('✅ Suivi sauvegardé · garde ' + getSavedHours() + ' h');
    else toast('❌ Suivi retiré');
  };
  // insère avant les 2 boutons Google/Close
  actions.parentNode.insertBefore(btn, actions);
}

/* Bouton sur Prochains parcours (cartes .bdt — ici cards de la liste et des résultats) */
function injectCardSaveButtons(){
  // Cartes sur page principale "Prochains parcours" : button contenant "Arrive dans" + .from/.to
  var cards = document.querySelectorAll('button[class*="rounded-"][class*="shadow-"]');
  cards.forEach(function(card){
    if(card.querySelector('.bd194-save-card-btn')) return;
    if(card.closest('.bdt-sheet')) return;
    if(card.closest('#bd-v173-popup')) return;
    var txt = card.textContent || '';
    if(!/Arrive dans|Départ dans|Trajet terminé/.test(txt)) return;

    // Récupère la connexion via les data du bouton (on cherche dans __bd_trips)
    var conn = findConnForCard(card);
    if(!conn) return;

    var saved = isSaved(conn);
    var btn = document.createElement('button');
    btn.className = 'bd194-save-card-btn' + (saved ? ' is-saved' : '');
    btn.innerHTML = saved ? '✓ Enregistré' : '🔖 Enregistrer';
    btn.onclick = function(e){
      e.preventDefault();
      e.stopPropagation();
      var nowSaved = window.__bd_toggleSaveLive(conn, {cardEl: card});
      btn.classList.toggle('is-saved', nowSaved);
      btn.innerHTML = nowSaved ? '✓ Enregistré' : '🔖 Enregistrer';
    };

    // insère dans la zone tags (mt-3)
    var tagZone = card.querySelector('.mt-3');
    if(tagZone) tagZone.appendChild(btn);
    else card.appendChild(btn);
  });
}

/* Retrouve la connexion correspondant à une carte */
function findConnForCard(card){
  try{
    var trips = window.__bd_trips || {};
    var keys = Object.keys(trips);
    if(!keys.length) return null;
    var txt = (card.textContent || '').replace(/\s+/g,' ');
    var best = null, score = -1;
    keys.forEach(function(k){
      var c = trips[k];
      if(!c) return;
      var s = 0;
      var fn = (c._fromStop || (c.from && c.from.station) || '').toLowerCase();
      if(fn && txt.toLowerCase().indexOf(fn) >= 0) s += 4;
      var ft = (c.from && c.from.time) || '';
      if(ft && txt.indexOf(ft) >= 0) s += 3;
      var tn = (c.to && c.to.station) || '';
      if(tn && txt.indexOf(tn) >= 0) s += 2;
      (c.products || []).forEach(function(p){ if(p && txt.indexOf(p) >= 0) s += 1; });
      if(s > score){ score = s; best = c; }
    });
    return score > 0 ? best : null;
  }catch(e){ return null; }
}

/* Retrouve la connexion affichée dans Suivi en direct */
function getCurrentLiveConn(){
  try{
    var sheet = document.querySelector('.bdt-sheet');
    if(!sheet) return null;
    var trips = window.__bd_trips || {};
    var keys = Object.keys(trips);
    if(!keys.length) return null;
    var txt = (sheet.textContent || '').replace(/\s+/g,' ');
    var best = null, score = -1;
    keys.forEach(function(k){
      var c = trips[k];
      if(!c) return;
      var s = 0;
      var fn = (c._fromStop || (c.from && c.from.station) || '').toLowerCase();
      if(fn && txt.toLowerCase().indexOf(fn) >= 0) s += 4;
      var ft = (c.from && c.from.time) || '';
      if(ft && txt.indexOf(ft) >= 0) s += 3;
      var tn = (c.to && c.to.station) || '';
      if(tn && txt.indexOf(tn) >= 0) s += 2;
      (c.products || []).forEach(function(p){ if(p && txt.indexOf(p) >= 0) s += 1; });
      if(s > score){ score = s; best = c; }
    });
    return score > 0 ? best : null;
  }catch(e){ return null; }
}

/* ---------- Encadré "Suivis sauvegardés" ---------- */

function ensureSavedBlock(){
  // Cherche la section "Mes parcours" (dalles)
  var tilesHeading = null;
  var headings = document.querySelectorAll('h3');
  for(var i=0;i<headings.length;i++){
    if(/^\s*Mes parcours/i.test(headings[i].textContent || '')){ tilesHeading = headings[i]; break; }
  }
  if(!tilesHeading) return;

  var tilesSection = tilesHeading.closest('section');
  if(!tilesSection) return;

  // L'encadré doit être AVANT la section Mes parcours
  var existing = document.getElementById('bd194-saved-block');
  if(existing){
    // vérifie position
    if(existing.nextElementSibling !== tilesSection){
      tilesSection.parentNode.insertBefore(existing, tilesSection);
    }
    renderSavedBlock();
    return;
  }

  var block = document.createElement('section');
  block.id = 'bd194-saved-block';
  block.className = 'bd194-saved-live';
  block.style.display = 'none'; // caché tant que vide
  tilesSection.parentNode.insertBefore(block, tilesSection);
  renderSavedBlock();
}

function renderSavedBlock(){
  var block = document.getElementById('bd194-saved-block');
  if(!block) return;

  var list = loadSaved();
  if(!list.length){
    block.style.display = 'none';
    return;
  }
  block.style.display = '';
  var hours = getSavedHours();
  var now = Date.now();

  // tri : live d'abord, puis par heure de fin
  list.sort(function(a,b){
    var aLive = (now >= a.startMs && now <= a.endMs) ? 1 : 0;
    var bLive = (now >= b.startMs && now <= b.endMs) ? 1 : 0;
    if(aLive !== bLive) return bLive - aLive;
    return (a.startMs||0) - (b.startMs||0);
  });

  var rows = list.map(function(item){
    var isLive = now >= item.startMs && now <= item.endMs;
    var isDone = now > item.endMs;
    var dotCls = isLive ? '' : (isDone ? 'done' : 'wait');
    var remainMs = item.endMs + hours*3600000 - now;
    var remainMin = Math.max(0, Math.round(remainMs/60000));
    var remainTxt = remainMin < 60 ? (remainMin + ' min') : (Math.round(remainMin/60) + ' h');
    var prods = (item.products || []).slice(0,3);
    var prodHtml = prods.map(function(p){
      var col = '#57534e';
      try{ if(typeof getLineColor === 'function') col = getLineColor(p); }catch(e){}
      return '<span class="bd194-saved-live-chip" style="background:'+col+';color:#fff">'+escapeHtml(p)+'</span>';
    }).join('');
    return '<div class="bd194-saved-live-row'+(isLive?' is-live':'')+'" data-bd194-id="'+item.id+'">' +
      '<span class="bd194-live-dot '+dotCls+'"></span>' +
      '<div class="bd194-saved-live-main">' +
        '<div class="bd194-saved-live-fromto">'+escapeHtml(item.from.station)+' → '+escapeHtml(item.to.station)+'</div>' +
        '<div class="bd194-saved-live-meta">' +
          (isLive ? '<span class="bd194-saved-live-chip live">EN DIRECT</span>' : '') +
          '<span>'+escapeHtml(item.from.time||'')+'</span>' +
          '<span>→ '+escapeHtml(item.to.time||'')+'</span>' +
          (item.duration ? '<span>'+escapeHtml(item.duration)+'</span>' : '') +
          prodHtml +
          '<span style="opacity:.7">· garde '+remainTxt+'</span>' +
        '</div>' +
      '</div>' +
      '<span class="bd194-saved-live-go">›</span>' +
    '</div>';
  }).join('');

  block.innerHTML =
    '<div class="bd194-saved-live-head">' +
      '<div class="bd194-saved-live-title">🔖 Suivis sauvegardés <span class="bd194-saved-live-count">'+list.length+'</span></div>' +
    '</div>' +
    '<div class="bd194-saved-live-list">'+rows+'</div>';

  // click pour rouvrir
  block.querySelectorAll('.bd194-saved-live-row').forEach(function(row){
    row.onclick = function(){
      var id = row.getAttribute('data-bd194-id');
      var item = null;
      loadSaved().forEach(function(x){ if(x.id === id) item = x; });
      if(!item) return;
      reopenSavedLive(item);
    };
  });
}

function reopenSavedLive(item){
  try{
    // Injecte dans __bd_trips pour que le suivi fonctionne
    var conn = {
      id: item.id,
      _fromStop: item.fromStop,
      from: {
        station: item.from.station,
        time: item.from.time,
        departure: item.from.departure,
        delay: item.from.delay,
        platform: item.from.platform,
        actualMs: item.startMs
      },
      to: {
        station: item.to.station,
        time: item.to.time,
        arrival: item.to.arrival,
        delay: item.to.delay,
        actualMs: item.endMs
      },
      duration: item.duration,
      products: item.products,
      transfers: item.transfers,
      passList: item.passList,
      originQuery: item.originQuery,
      destQuery: item.destQuery,
      _sort: item.startMs
    };
    // clé du suivi
    var key = (item.fromStop || '') + '|' + (item.from.departure || '') + '|' + (item.products||[]).join(',');
    window.__bd_trips = window.__bd_trips || {};
    window.__bd_trips[key] = conn;

    // Ouvre le suivi via l'API React existante
    // On tente via le bouton "Live" caché ou via __bd_activeTL
    var setLe = window.__bd_setLive;
    if(typeof setLe === 'function'){
      setLe(conn);
    } else {
      // fallback : simule un click sur la première carte correspondante si elle existe
      // Ou dispatch un événement custom que le code React écoute (si présent)
      window.dispatchEvent(new CustomEvent('bd-open-live', {detail: conn}));
      // fallback ultime : affiche un toast si rien ne s'ouvre
      setTimeout(function(){
        if(!document.querySelector('.bdt-sheet')){
          toast('⚠️ Ouvre « Prochains parcours » puis clique sur la carte');
        }
      }, 400);
    }
  }catch(e){
    toast('⚠️ Impossible de rouvrir ce suivi');
  }
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- MutationObserver global ---------- */
var pending = null;
function schedule(){
  if(pending) return;
  pending = setTimeout(function(){
    pending = null;
    ensureSavedBlock();
    injectLiveSaveButton();
    injectCardSaveButtons();
  }, 120);
}

function start(){
  schedule();
  try{
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  }catch(e){}
  setInterval(schedule, 1500);
  window.addEventListener('bd-saved-live-change', function(){ setTimeout(renderSavedBlock, 30); });
  window.addEventListener('storage', function(e){
    if(e.key === STORAGE_KEY || e.key === 'bd_savedLiveHours'){ setTimeout(renderSavedBlock, 30); }
  });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

/* ---------- Patch page Distances : ajouter le champ "Durée de sauvegarde des suivis" ---------- */

function injectDistancesField(){
  var overlay = document.getElementById('bd-v182-overlay');
  if(!overlay || !overlay.classList.contains('open')) return;
  if(overlay.querySelector('#bd182-savedhours')) return;

  var sheet = overlay.querySelector('.bd182-sheet');
  if(!sheet) return;

  // Cherche la section "VOUS ÊTES DANS CE VÉHICULE" pour insérer après
  var sections = sheet.querySelectorAll('.bd182-sec');
  var target = null;
  sections.forEach(function(s){
    if(/VOUS ÊTES DANS CE VÉHICULE/i.test(s.textContent || '')) target = s;
  });

  var sec = document.createElement('div');
  sec.className = 'bd182-sec';
  sec.id = 'bd182-sec-saved';
  sec.innerHTML =
    '<h4>🔖 SUIVIS SAUVEGARDÉS</h4>' +
    '<div class="bd182-field">' +
      '<label>Durée de conservation après la fin du parcours (heures)</label>' +
      '<input id="bd182-savedhours" class="bd182-input" type="number" min="1" max="72" step="1" placeholder="3">' +
      '<div class="bd182-hint">Défaut 3h • Les suivis enregistrés s\'effacent automatiquement après la fin du parcours + cette durée. Entre 1 et 72 h.</div>' +
    '</div>';

  if(target && target.nextSibling) sheet.insertBefore(sec, target.nextSibling);
  else sheet.appendChild(sec);

  var input = sec.querySelector('#bd182-savedhours');
  input.value = getSavedHours();

  // Patch du bouton Sauvegarder pour inclure cette valeur
  var saveBtn = document.getElementById('bd182-save');
  if(saveBtn && !saveBtn.__bd194Patched){
    saveBtn.__bd194Patched = true;
    var origClick = saveBtn.onclick;
    saveBtn.onclick = function(e){
      var hInput = document.getElementById('bd182-savedhours');
      if(hInput){
        var v = parseInt(hInput.value, 10);
        if(!isNaN(v) && v >= 1 && v <= 72){
          setSavedHours(v);
          // purge immédiate selon la nouvelle durée
          var list = loadSaved();
          saveSaved(list);
          renderSavedBlock();
        }
      }
      if(origClick) return origClick.call(this, e);
    };
  }
}

// Observer l'ouverture de la page Distances
function watchDistances(){
  var obs = new MutationObserver(function(){
    var overlay = document.getElementById('bd-v182-overlay');
    if(overlay && overlay.classList.contains('open')){
      setTimeout(injectDistancesField, 50);
    }
  });
  var overlay = document.getElementById('bd-v182-overlay');
  if(overlay) obs.observe(overlay, {attributes:true, attributeFilter:['class']});
  else {
    // attend que l'overlay soit créé
    var t = setInterval(function(){
      var o = document.getElementById('bd-v182-overlay');
      if(o){
        clearInterval(t);
        obs.observe(o, {attributes:true, attributeFilter:['class']});
        if(o.classList.contains('open')) injectDistancesField();
      }
    }, 500);
  }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watchDistances);
else watchDistances();

/* ---------- Patch : réactiver bouton Distances du menu ---------- */
function ensureDistancesMenu(){
  // Le bouton #bd-v179-item est créé par le script V182
  // On s'assure qu'il est visible et fonctionnel
  var item = document.getElementById('bd-v179-item');
  if(!item) return;
  if(item.__bd194Wired) return;
  item.__bd194Wired = true;
  item.style.display = 'flex';
  item.style.visibility = 'visible';
  item.onclick = function(e){
    e.preventDefault();
    e.stopPropagation();
    var m = document.getElementById('bd-v101-menu');
    if(m) m.classList.remove('open');
    if(typeof window.__bd_openDistances === 'function'){
      window.__bd_openDistances();
    } else {
      // fallback : ouvre l'overlay directement
      var o = document.getElementById('bd-v182-overlay');
      if(o){ o.classList.add('open'); injectDistancesField(); }
    }
  };
}

// Observer le menu
function watchMenu(){
  var grid = document.querySelector('.bd-v101-grid');
  if(!grid){
    setTimeout(watchMenu, 300);
    return;
  }
  ensureDistancesMenu();
  new MutationObserver(function(){
    ensureDistancesMenu();
  }).observe(grid, {childList:true});
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watchMenu);
else watchMenu();
